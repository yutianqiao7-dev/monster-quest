<title>モンスタークエスト</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
:root{
  color-scheme: dark;
  --shell-1:#2f2c47; --shell-2:#211f33; --shell-3:#191727;
  --bezel:#100f19; --edge:#3f3b5c;
  --gold:#f4b942; --ink:#c9c5e0; --dim:#6f6a90;
  --btn:#3b3852; --btn-hi:#524e70; --btn-lo:#26243a;
  --a:#e0553f; --a-lo:#8d2f22; --b:#4a4766; --b-lo:#2c2a40;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #35314f 0%, #14131f 60%, #0b0a12 100%);
  color:var(--ink);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none; overscroll-behavior:none;
  display:flex; align-items:center; justify-content:center;
}
#device{
  width:100%; max-width:440px; height:100dvh; max-height:960px;
  padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:10px;
}
#body{
  flex:1; min-height:0;
  display:flex; flex-direction:column; gap:12px;
  padding:14px 14px 18px;
  border-radius:22px 22px 34px 34px;
  background:linear-gradient(178deg, var(--shell-1) 0%, var(--shell-2) 46%, var(--shell-3) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.13),
    inset 0 -3px 0 rgba(0,0,0,.4),
    0 18px 40px rgba(0,0,0,.55);
}
#spacer{ flex:1; min-height:0; }
#bezel{
  position:relative; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  background:var(--bezel); border-radius:12px 12px 26px 12px;
  padding:14px 12px 20px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.07);
}
#screen{ display:block; border-radius:2px; background:#0a0d0a; image-rendering:pixelated; }
#led{ position:absolute; left:14px; top:50%; width:7px; height:7px; border-radius:50%;
  background:var(--a); box-shadow:0 0 7px var(--a); transform:translateY(-50%); }
#mark{ position:absolute; right:12px; bottom:5px; font-size:9px; letter-spacing:.16em; color:#4a4666; }
#pad{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 4px; }
.dpad{ display:grid; grid-template-columns:repeat(3,42px); grid-template-rows:repeat(3,42px); }
.dpad>div{ display:flex; align-items:center; justify-content:center; }
.key{
  background:linear-gradient(180deg,var(--btn-hi),var(--btn));
  box-shadow:0 3px 0 var(--btn-lo), 0 5px 8px rgba(0,0,0,.45);
  border:none; color:var(--ink); width:100%; height:100%;
  display:flex; align-items:center; justify-content:center; font-size:13px;
}
.key:active,.key.on{ transform:translateY(3px); box-shadow:0 0 0 var(--btn-lo); filter:brightness(1.15); }
.key:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
#u{border-radius:8px 8px 0 0;} #d{border-radius:0 0 8px 8px;}
#l{border-radius:8px 0 0 8px;} #r{border-radius:0 8px 8px 0;}
#c{ background:var(--btn); box-shadow:inset 0 0 6px rgba(0,0,0,.5); }
.ab{ display:flex; gap:12px; align-items:flex-end; padding-bottom:6px; }
.round{ width:56px; height:56px; border-radius:50%; font-size:17px; font-weight:700; letter-spacing:.02em; }
#B{ background:linear-gradient(180deg,#5b5780,var(--b)); box-shadow:0 4px 0 var(--b-lo),0 6px 10px rgba(0,0,0,.45); margin-bottom:16px; }
#A{ background:linear-gradient(180deg,#ef7057,var(--a)); box-shadow:0 4px 0 var(--a-lo),0 6px 10px rgba(0,0,0,.45); }
#sys{ display:flex; justify-content:center; gap:16px; }
.pill{ width:74px; height:20px; border-radius:10px; font-size:10px; letter-spacing:.14em;
  background:linear-gradient(180deg,#46425f,#332f49); box-shadow:0 2px 0 #221f33; color:#9a95bb; }
#foot{ display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--dim); letter-spacing:.1em; padding:0 4px; }
#foot b{ color:var(--gold); font-weight:400; letter-spacing:.22em; }
#mute{ background:none; border:1px solid #3a3654; color:var(--dim); border-radius:5px; padding:3px 8px; font:inherit; font-size:10px; }
@media (max-height:620px){ .dpad{grid-template-columns:repeat(3,36px); grid-template-rows:repeat(3,36px);} .round{width:48px;height:48px;} }
</style>

<div id="device">
  <div id="body">
    <div id="bezel">
      <span id="led"></span>
      <canvas id="screen"></canvas>
      <span id="mark">MONSTER QUEST</span>
    </div>
    <div id="spacer"></div>
    <div id="pad">
      <div class="dpad">
        <div></div><div><button class="key" id="u" data-k="up" aria-label="上">▲</button></div><div></div>
        <div><button class="key" id="l" data-k="left" aria-label="左">◀</button></div><div><span class="key" id="c"></span></div><div><button class="key" id="r" data-k="right" aria-label="右">▶</button></div>
        <div></div><div><button class="key" id="d" data-k="down" aria-label="下">▼</button></div><div></div>

      <div class="ab">

      <button class="key pill" data-k="select">SELECT</button>
      <button class="key pill" data-k="start">START</button>
    </div>
  </div>
  <div id="foot"><b>MQ-01</b><button id="mute">SOUND ON</button></div>
</div>

<script>
"use strict";
/* スマホ表示の保険: viewport が head に無ければ補う */
(function(){
  if(!document.querySelector('head meta[name="viewport"]')){
    const m=document.createElement('meta'); m.name='viewport';
    m.content='width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no';
    document.head.appendChild(m);
  }
})();
/* ============================ 基盤 ============================ */
const W=160, H=144;
const disp=document.getElementById('screen'), d=disp.getContext('2d');
const pix=document.createElement('canvas'); pix.width=W; pix.height=H;
const p=pix.getContext('2d'); p.imageSmoothingEnabled=false;
const FONT='"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif';
let S=3;

function fit(){
  const body=document.getElementById('body'), bz=document.getElementById('bezel');
  const pad=document.getElementById('pad'), sys=document.getElementById('sys');
  const bs=getComputedStyle(body), zs=getComputedStyle(bz);
  const gap=parseFloat(bs.rowGap)||12;
  const aw=bz.clientWidth-parseFloat(zs.paddingLeft)-parseFloat(zs.paddingRight);
  const ah=body.clientHeight-parseFloat(bs.paddingTop)-parseFloat(bs.paddingBottom)
         -pad.offsetHeight-sys.offsetHeight-gap*3
         -parseFloat(zs.paddingTop)-parseFloat(zs.paddingBottom);
  if(aw<40||ah<40) return;
  const cw=Math.floor(Math.min(aw, ah*W/H)), ch=Math.round(cw*H/W);
  const dpr=Math.min(window.devicePixelRatio||1,3);
  S=Math.max(2,Math.min(8,Math.ceil(cw*dpr/W)));
  disp.width=W*S; disp.height=H*S;
  disp.style.width=cw+'px'; disp.style.height=ch+'px';
  d.imageSmoothingEnabled=false; d.textBaseline='top';
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,150));
addEventListener('load',()=>{ fit(); setTimeout(fit,60); });
if(window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('body'));

/* 描画ヘルパ（論理座標→デバイス座標） */
function T(str,x,y,o){
  o=o||{}; const sz=o.size||9, mx=o.max?o.max*S:undefined;
  d.font=(o.weight||400)+' '+(sz*S)+'px '+FONT;
  d.textAlign=o.align||'left';
  if(o.shadow!==false){ d.fillStyle=o.shadow||'rgba(0,0,0,.55)';
    d.fillText(str,x*S+Math.max(1,S*0.35),y*S+Math.max(1,S*0.35),mx); }
  d.fillStyle=o.color||'#fff'; d.fillText(str,x*S,y*S,mx);
  d.textAlign='left';
}
function tw(str,size){ d.font='400 '+(size*S)+'px '+FONT; return d.measureText(str).width/S; }
function box(x,y,w,h,o){
  o=o||{};
  d.fillStyle=o.bg||'rgba(16,14,26,.92)';
  rr(x*S,y*S,w*S,h*S,3*S); d.fill();
  d.lineWidth=Math.max(1,S); d.strokeStyle=o.line||'#e8e4ff'; d.stroke();
  if(o.inner!==false){ d.lineWidth=Math.max(1,S*0.5); d.strokeStyle='rgba(120,112,170,.5)';
    rr(x*S+2*S,y*S+2*S,(w-4)*S,(h-4)*S,2*S); d.stroke(); }
}
function rr(x,y,w,h,r){ d.beginPath(); d.moveTo(x+r,y); d.arcTo(x+w,y,x+w,y+h,r); d.arcTo(x+w,y+h,x,y+h,r); d.arcTo(x,y+h,x,y,r); d.arcTo(x,y,x+w,y,r); d.closePath(); }
function fill(x,y,w,h,c){ d.fillStyle=c; d.fillRect(x*S,y*S,w*S,h*S); }
function wrap(str,width,size){
  const out=[]; let line='';
  for(const ch of str){
    if(ch==='\n'){ out.push(line); line=''; continue; }
    if(tw(line+ch,size)>width && line){ out.push(line); line=ch; } else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============================ 音 ============================ */
let AC=null, muted=false;
function sfx(kind){
  if(muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const spec={
      tick:[[880,0.04]], ok:[[660,0.05],[990,0.07]], no:[[220,0.12]],
      hit:[[180,0.05],[120,0.08]], crit:[[300,0.04],[420,0.04],[200,0.1]],
      faint:[[440,0.08],[330,0.08],[220,0.16]], heal:[[520,0.06],[660,0.06],[880,0.1]],
      ball:[[440,0.05],[560,0.05]], catch:[[523,0.09],[659,0.09],[784,0.09],[1046,0.2]],
      lvl:[[523,0.07],[659,0.07],[784,0.14]], warp:[[300,0.05],[500,0.05],[700,0.05]]
    }[kind]||[[600,0.04]];
    let t=AC.currentTime;
    for(const [f,dur] of spec){
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='square'; o.frequency.value=f;
      g.gain.setValueAtTime(0.055,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur); t+=dur;
    }
  }catch(e){}
}
document.getElementById('mute').onclick=e=>{ muted=!muted; e.target.textContent=muted?'SOUND OFF':'SOUND ON'; if(!muted) sfx('ok'); };

/* ============================ 入力 ============================ */
const held={up:0,down:0,left:0,right:0};
const ui={text:null, menu:null, busy:false, fade:0, flashScreen:0};
let waitA=null, scene='boot';

function press(k){
  sfx(k==='a'?'ok':'tick');
  if(ui.text && !ui.text.done){ ui.text.n=ui.text.full.length; return; }
  if(ui.menu){ menuKey(k); return; }
  if(waitA && (k==='a'||k==='b')){ const r=waitA; waitA=null; r(); return; }
  if(ui.busy) return;
  if(scene==='field'){
    if(k==='a') interact();
    else if(k==='b'||k==='start') openMenu();
  } else if(scene==='title'){ if(k==='a'||k==='start') titleGo(); }
}
function menuKey(k){
  const m=ui.menu, n=m.items.length, cols=m.cols||1;
  if(k==='up') m.idx=(m.idx-cols+n)%n;
  else if(k==='down') m.idx=(m.idx+cols)%n;
  else if(k==='left') m.idx=(m.idx-1+n)%n;
  else if(k==='right') m.idx=(m.idx+1)%n;
  else if(k==='a'){ if(m.items[m.idx].dis){ sfx('no'); return; } const r=m.res; ui.menu=null; r(m.idx); }
  else if(k==='b'||k==='start'){ if(m.cancel){ const r=m.res; ui.menu=null; sfx('no'); r(-1); } else sfx('no'); }
  if(m.onMove) m.onMove(m.idx);
}
function waitPress(){ return new Promise(r=>{ waitA=r; }); }
function choose(items,o){
  o=o||{};
  return new Promise(r=>{ ui.menu=Object.assign({items:items.map(x=>typeof x==='string'?{t:x}:x), idx:o.idx||0, res:r}, o); });
}
async function say(txt,o){
  o=o||{};
  ui.text={full:txt, n:0, done:false, name:o.name||null};
  while(ui.text && ui.text.n<txt.length){ ui.text.n+=2; await sleep(22); }
  if(!ui.text) return;
  ui.text.n=txt.length; ui.text.done=true;
  if(!o.keep) { await waitPress(); ui.text=null; }
}

for(const b of document.querySelectorAll('[data-k]')){
  const k=b.dataset.k;
  const dn=e=>{ e.preventDefault(); b.classList.add('on'); if(held[k]!==undefined) held[k]=1; press(k); };
  const up=e=>{ e.preventDefault(); b.classList.remove('on'); if(held[k]!==undefined) held[k]=0; };
  b.addEventListener('pointerdown',dn); b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',Enter:'a',x:'b',Escape:'b',Shift:'start',Backspace:'b'};
addEventListener('keydown',e=>{ const k=KEYMAP[e.key]; if(!k) return; e.preventDefault(); if(held[k]!==undefined){ if(held[k]) return; held[k]=1; } press(k); });
addEventListener('keyup',e=>{ const k=KEYMAP[e.key]; if(k&&held[k]!==undefined) held[k]=0; });

/* 十字キー長押しリピート */
let repT=0;
function dirHeld(){ for(const k of ['up','down','left','right']) if(held[k]) return k; return null; }
/* ============================ タイプ ============================ */
const TY={

const eff=(at,df)=>((CHART[at]||{})[df]!==undefined?CHART[at][df]:1);

/* c:[輪郭,主色,影,明,差し色,差し色2] */
const SP={
  mokuri:{n:'モクリ',t:'くさ',b:[45,49,49,45],x:64,cr:45,ev:['jukario',16],c:['#20402a','#7fd36a','#4e9c46','#b6f09a','#3fa03c','#e8c15a'],

/* ============================ 個体生成 ============================ */
function expFor(l){ return l*l*l; }
function statHP(b,l){ return Math.floor(b*2*l/100)+l+10; }
function statOf(b,l){ return Math.floor(b*2*l/100)+5; }
function movesAt(id,l){
  const out=[];
  for(const [ml,mv] of SP[id].lv) if(ml<=l){ if(!out.includes(mv)) out.push(mv); }
  return out.slice(-4);
}
function mk(id,l){
  const s=SP[id], m={id,lv:l,name:s.n,st:null,slp:0,
    mv:movesAt(id,l).map(k=>({k,pp:MV[k].pp,mp:MV[k].pp}))};
  m.max=statHP(s.b[0],l); m.hp=m.max;
  m.atk=statOf(s.b[1],l); m.def=statOf(s.b[2],l); m.spd=statOf(s.b[3],l);
  m.exp=expFor(l);
  return m;
}
/* ステータス再計算。現在HPは呼び出し側が「増えた分だけ加算」する（最大値は超えない） */
function recalc(m){
  const s=SP[m.id];
  m.max=statHP(s.b[0],m.lv);
  m.atk=statOf(s.b[1],m.lv); m.def=statOf(s.b[2],m.lv); m.spd=statOf(s.b[3],m.lv);
  if(m.hp>m.max) m.hp=m.max;
}
function grow(m,fn){ const oh=m.max; fn(); recalc(m); m.hp=clamp(m.hp+(m.max-oh),0,m.max); }

const CACHE=new Map();
function bake(rows,pal,key){
  if(CACHE.has(key)) return CACHE.get(key);
  const cv=document.createElement('canvas'); cv.width=16; cv.height=16;
  const g=cv.getContext('2d');
  for(let y=0;y<rows.length;y++){
    const r=rows[y];
    for(let x=0;x<r.length;x++){
      const ch=r[x]; if(ch==='.'||ch===' ') continue;
      const col=pal[ch]; if(!col) continue;
      g.fillStyle=col; g.fillRect(x,y,1,1);
    }
  }
  CACHE.set(key,cv); return cv;
}
function monSpr(id){ return bake(ART[id],monPal(id),'m'+id); }
function heroSpr(k,dir){
  const dd=(dir==='left'||dir==='right')?'side':(HERO[dir]?dir:'down');
  return bake(HERO[dd],heroPal(k),'h'+k+dd);
}
function drawSpr(cv,x,y,sc,flip,ctx){
  const g=ctx||p; g.imageSmoothingEnabled=false;
  g.save();
  if(flip){ g.translate(x+16*sc,y); g.scale(-1,1); g.drawImage(cv,0,0,16*sc,16*sc); }
  else g.drawImage(cv,x,y,16*sc,16*sc);
  g.restore();
}

    case 'T':{

/* ============================ ゲーム状態 ============================ */
const ITEMS={
  ball:{n:'モンスターボール',pr:200,ball:1.0,ds:'やせいのモンスターを つかまえる。'},
  gball:{n:'スーパーボール',pr:600,ball:1.6,ds:'つかまえやすい ボール。'},

  full:{n:'なんでもなおし',pr:250,cure:1,ds:'どく・まひ・ねむりを なおす。'}
};
const SHOPLIST=['ball','gball','potion','spotion','full','revive'];
let G=null;
function newGame(){
  G={map:'town',x:9,y:15,dir:'up',party:[],box:[],
     bag:{ball:5,potion:3},money:1500,dex:{},flags:{},steps:0,play:0};
}
const SAVEKEY='monsterquest_v1';
function save(){ try{ localStorage.setItem(SAVEKEY,JSON.stringify(G)); return true; }catch(e){ return false; } }
function load(){ try{ const s=localStorage.getItem(SAVEKEY); if(!s) return false; G=JSON.parse(s); return true; }catch(e){ return false; } }
function hasSave(){ try{ return !!localStorage.getItem(SAVEKEY); }catch(e){ return false; } }
function seen(id){ if(!G.dex[id]) G.dex[id]=1; }
function caught(id){ G.dex[id]=2; }
const M=()=>MAPS[G.map];
const alive=()=>G.party.filter(m=>m.hp>0);

/* ============================ 移動 ============================ */
let mv=null, bob=0, cam={x:0,y:0};
function tileAt(mp,x,y){
  const r=mp.rows; if(y<0||y>=r.length||x<0||x>=r[0].length) return 'T';
  return r[y][x];
}
function npcAt(mp,x,y){ return (mp.npcs||[]).find(n=>n.x===x&&n.y===y&&!(n.gone)); }
function blocked(mp,x,y){ return SOLID.includes(tileAt(mp,x,y)) || !!npcAt(mp,x,y); }
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};

function tryMove(dir){
  G.dir=dir;
  const [dx,dy]=DIRV[dir], nx=G.x+dx, ny=G.y+dy;
  if(blocked(M(),nx,ny)) return;
  mv={dx,dy,t:0,dur:13};
}
function updField(){
  if(mv){
    mv.t++;
    if(mv.t>=mv.dur){
      G.x+=mv.dx; G.y+=mv.dy; mv=null; G.steps++;
      onStep();
    }
    return;
  }
  if(ui.busy||ui.menu||ui.text) return;
  const dir=dirHeld();
  if(dir){ if(repT<=0){ tryMove(dir); repT=0; } } else repT=0;
}
function onStep(){
  const mp=M();
  const w=(mp.warps||[]).find(w=>w.x===G.x&&w.y===G.y);
  if(w){ doWarp(w); return; }
  if(tileAt(mp,G.x,G.y)===','&&mp.enc&&alive().length){
    if(Math.random()<0.13) startWild(mp);
  }
}
async function doWarp(w){
  ui.busy=true; sfx('warp');
  for(let i=0;i<=10;i++){ ui.fade=i/10; await sleep(20); }
  G.map=w.to; G.x=w.tx; G.y=w.ty; mv=null;
  ui.busy=false; ui.banner={t:MAPS[w.to].name,n:110};
  for(let i=10;i>=0;i--){ ui.fade=i/10; await sleep(20); }
  ui.fade=0;
}
function startWild(mp){
  const tot=mp.enc.list.reduce((a,b)=>a+b[1],0);
  let r=Math.random()*tot, id=mp.enc.list[0][0];
  for(const [k,wt] of mp.enc.list){ r-=wt; if(r<=0){ id=k; break; } }
  const lv=ri(mp.enc.lv[0],mp.enc.lv[1]);
  battle({wild:mk(id,lv)});
}
function facing(){ const [dx,dy]=DIRV[G.dir]; return {x:G.x+dx,y:G.y+dy}; }
function interact(){
  const mp=M(), f=facing(), n=npcAt(mp,f.x,f.y);
  if(n){ n.dir={up:'down',down:'up',left:'right',right:'left'}[G.dir]; talk(n); return; }
  const s=(mp.signs||{})[f.x+','+f.y];
  if(s){ runScript([s]); return; }
  const t=tileAt(mp,f.x,f.y);
  if(t==='D') runScript(['カギが かかっている…']);
  else if(t==='W') runScript(['みずうみだ。とても きれいだ。']);
  else if(t==='T') runScript(['おおきな きが しげっている。']);
}
async function runScript(lines){
  ui.busy=true;
  for(const l of lines) await say(l);
  ui.busy=false;
}
async function talk(n){
  ui.busy=true;
  if(n.heal){
    await say('ようこそ! モンスターを かいふく しますか?',{name:n.nm,keep:true});
    const c=await choose(['はい','いいえ'],{x:104,y:66,w:50,cancel:true,cols:1});
    ui.text=null;
    if(c===0){
      sfx('heal'); ui.flashScreen=18;
      for(const m of G.party){ m.hp=m.max; m.st=null; m.slp=0; for(const q of m.mv) q.pp=q.mp; }
      await sleep(500);
      await say('はい! げんきに なりましたよ。',{name:n.nm});
    } else await say('また いつでも どうぞ。',{name:n.nm});
    ui.busy=false; return;
  }
  if(n.shop){ await shop(n); ui.busy=false; return; }
  if(n.trainer){
    const done=G.flags['t_'+G.map+'_'+n.x+'_'+n.y];
    const tr=n.trainer;
    if(done){ for(const l of tr.after) await say(l,{name:n.nm}); ui.busy=false; return; }
    for(const l of tr.pre) await say(l,{name:n.nm});
    ui.busy=false;
    const party=(tr.rival? rivalParty() : tr.party).map(([id,lv])=>mk(id,lv));
    battle({trainer:{name:n.nm,party,money:tr.money,win:tr.win,key:'t_'+G.map+'_'+n.x+'_'+n.y}});
    return;
  }
  for(const l of (n.say||['…'])) await say(l,{name:n.nm});
  ui.busy=false;
}
function rivalParty(){
  const s=G.flags.starter||'mokuri';
  const counter={mokuri:'pochika',pochika:'shizuku',shizuku:'mokuri'}[s];
  return [['nonezu',12],['chunpi',13],[counter,15]];
}

/* ============================ フィールド描画 ============================ */
function drawField(){
  const mp=M(), rows=mp.rows, mw=rows[0].length*16, mh=rows.length*16;
  const off=mv?mv.t/mv.dur:0;
  const px_=(G.x+(mv?mv.dx*off:0))*16, py=(G.y+(mv?mv.dy*off:0))*16;
  cam.x=clamp(Math.round(px_-72),0,Math.max(0,mw-W));
  cam.y=clamp(Math.round(py-64),0,Math.max(0,mh-H));
  p.fillStyle='#000'; p.fillRect(0,0,W,H);
  const t0=Math.floor(cam.x/16), t1=Math.ceil((cam.x+W)/16);
  const s0=Math.floor(cam.y/16), s1=Math.ceil((cam.y+H)/16);
  for(let y=s0;y<=s1;y++) for(let x=t0;x<=t1;x++)
    drawTile(tileAt(mp,x,y),x*16-cam.x,y*16-cam.y,x,y);
  const ents=[];
  for(const n of (mp.npcs||[])){ if(n.gone) continue;
    ents.push({y:n.y*16,draw:()=>{
      drawSpr(heroSpr(n.pal,n.dir),n.x*16-cam.x,n.y*16-cam.y-2,1,n.dir==='left');
      if(n.trainer && !G.flags['t_'+G.map+'_'+n.x+'_'+n.y]){
        const b=Math.sin(tick/9)*1.5;
        p.fillStyle='#fff'; p.fillRect(n.x*16-cam.x+7,n.y*16-cam.y-12+b,2,5); p.fillRect(n.x*16-cam.x+7,n.y*16-cam.y-6+b,2,2);
      }
    }});
  }
  const walking=!!mv, bobo=walking?(Math.floor(mv.t/4)%2?1:0):0;
  ents.push({y:py,draw:()=>drawSpr(heroSpr('hero',G.dir),Math.round(px_-cam.x),Math.round(py-cam.y)-2+bobo,1,G.dir==='left')});
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents) e.draw();
  if(tileAt(mp,G.x,G.y)===','){ p.fillStyle='#3f8a3a'; p.fillRect(Math.round(px_-cam.x),Math.round(py-cam.y)+9,16,5);
    p.fillStyle='#5cc255'; for(let i=0;i<4;i++) p.fillRect(Math.round(px_-cam.x)+2+i*4,Math.round(py-cam.y)+9,1,4); }
}
/* ============================ 戦闘 ============================ */
let bt=null;
const stg=n=>n>=0?(2+n)/2:2/(2-n);
function resetB(m){ m.bst={atk:0,def:0}; }
function calcDmg(a,b,mv){
  const stab=SP[a.id].t===mv.t?1.5:1, e=eff(mv.t,SP[b.id].t);
  const crit=Math.random()<0.0625?2:1;
  const A=a.atk*stg(a.bst.atk), D=b.def*stg(b.bst.def);
  let v=Math.floor(((2*a.lv/5+2)*mv.pw*A/D)/50)+2;
  v=Math.floor(v*stab*e*crit*(0.85+Math.random()*0.15));
  return {v:Math.max(1,v),e,crit};
}
function catchShakes(f,mul){
  const st=f.st==='ねむり'?2:(f.st?1.5:1);
  const a=((3*f.max-2*f.hp)/(3*f.max))*SP[f.id].cr*mul*st;
  if(a>=255) return 4;
  const b=Math.floor(65536/Math.pow(255/a,0.25));
  let s=0; for(let i=0;i<4;i++){ if(Math.floor(Math.random()*65536)<b) s++; else break; }
  return s;
}
async function tweenHp(side){
  const key=side==='me'?'dm':'df';
  const tgt=(side==='me'?bt.me:bt.foe).hp;
  while(Math.abs(bt[key]-tgt)>0.4){ bt[key]+=(tgt-bt[key])*0.18; await sleep(16); }
  bt[key]=tgt;
}
async function shake(side,n){
  const k=side==='me'?'md':'fd';
  for(let i=0;i<(n||4);i++){ bt.anim[k]=(i%2?-3:3); await sleep(45); }
  bt.anim[k]=0;
}
async function blink(side,n){
  const k=side==='me'?'mh':'fh';
  for(let i=0;i<(n||3);i++){ bt.anim[k]=1; await sleep(70); bt.anim[k]=0; await sleep(70); }
}
async function lunge(side){
  const k=side==='me'?'md':'fd', s=side==='me'?1:-1;
  for(let i=0;i<5;i++){ bt.anim[k]=s*(i+1)*2; await sleep(16); }
  for(let i=4;i>=0;i--){ bt.anim[k]=s*(i+1)*2; await sleep(16); }
  bt.anim[k]=0;
}
const nm=m=>m.name;
const foeLbl=()=>bt.wild?'やせいの '+nm(bt.foe):'あいての '+nm(bt.foe);

async function useMove(atkMe,key){
  const A=atkMe?bt.me:bt.foe, B=atkMe?bt.foe:bt.me;
  const slot=A.mv.find(x=>x.k===key); if(slot) slot.pp=Math.max(0,slot.pp-1);
  const m=MV[key], who=atkMe?nm(A):foeLbl();
  if(A.st==='ねむり'){
    if(A.slp>0){ A.slp--; await say(who+'は ぐっすり ねむっている!'); return; }
    A.st=null; await say(who+'は めを さました!');
  }
  if(A.st==='まひ' && Math.random()<0.25){ await say(who+'は からだが しびれて うごけない!'); return; }
  await say(who+'の '+m.n+'!',{keep:true});
  await sleep(280);
  if(m.ac>0 && Math.random()*100>m.ac){ ui.text=null; await say('しかし はずれた!'); return; }
  if(m.hl){ ui.text=null; const h=Math.floor(A.max*m.hl); A.hp=Math.min(A.max,A.hp+h); sfx('heal');
    await tweenHp(atkMe?'me':'foe'); await say(who+'は たいりょくを かいふくした!'); return; }
  if(m.sf){ ui.text=null; const [s,v]=m.sf; A.bst[s]=clamp(A.bst[s]+v,-6,6); sfx('ok');
    await say(who+'の '+(s==='atk'?'こうげき':'ぼうぎょ')+'が あがった!'); return; }
  if(m.en){ ui.text=null; const [s,v]=m.en; B.bst[s]=clamp(B.bst[s]+v,-6,6); sfx('no');
    await blink(atkMe?'foe':'me',2);
    await say((atkMe?foeLbl():nm(B))+'の '+(s==='atk'?'こうげき':'ぼうぎょ')+'が さがった!'); return; }
  if(m.pw===0 && m.st){
    ui.text=null;
    if(B.st){ await say((atkMe?foeLbl():nm(B))+'には こうかが なかった…'); return; }
    B.st=m.st; if(m.st==='ねむり') B.slp=ri(1,3);
    sfx('no'); await blink(atkMe?'foe':'me',3);
    await say((atkMe?foeLbl():nm(B))+'は '+m.st+'に なった!'); return;
  }
  const r=calcDmg(A,B,m);
  await lunge(atkMe?'me':'foe');
  sfx(r.crit>1?'crit':'hit');
  B.hp=Math.max(0,B.hp-r.v);
  ui.flashScreen=r.crit>1?8:4;
  await Promise.all([shake(atkMe?'foe':'me',r.e>=2?6:4), tweenHp(atkMe?'foe':'me')]);
  ui.text=null;
  if(r.crit>1) await say('きゅうしょに あたった!');
  if(r.e===0) await say('こうかが ないようだ…');
  else if(r.e>1) await say('こうかは バツグンだ!');
  else if(r.e<1) await say('こうかは いまひとつの ようだ…');
  if(B.hp>0 && m.st && Math.random()*100<(m.stc||0) && !B.st){
    B.st=m.st; if(m.st==='ねむり') B.slp=ri(1,3);
    await say((atkMe?foeLbl():nm(B))+'は '+m.st+'に なった!');
  }
}
async function endTurnStatus(who){
  const A=who==='me'?bt.me:bt.foe;
  if(A.hp<=0) return;
  if(A.st==='どく'){
    A.hp=Math.max(0,A.hp-Math.max(1,Math.floor(A.max/8)));
    sfx('no'); await blink(who,2); await tweenHp(who);
    await say((who==='me'?nm(A):foeLbl())+'は どくで きずついた!');
  }
}
function aiMove(){
  const f=bt.foe, usable=f.mv.filter(x=>x.pp>0);
  if(!usable.length) return 'tackle';
  let best=usable[0], bs=-1;
  for(const s of usable){
    const m=MV[s.k];
    let sc=m.pw? m.pw*eff(m.t,SP[bt.me.id].t)*(SP[f.id].t===m.t?1.5:1) : 28;
    sc*=0.7+Math.random()*0.6;
    if(sc>bs){ bs=sc; best=s; }
  }
  return best.k;
}
async function faintCheck(){
  if(bt.foe.hp<=0){
    sfx('faint'); await blink('foe',4); bt.anim.fh=1;
    await say(foeLbl()+'は たおれた!');
    return 'foe';
  }
  if(bt.me.hp<=0){
    sfx('faint'); await blink('me',4); bt.anim.mh=1;
    await say(nm(bt.me)+'は たおれてしまった!');
    return 'me';
  }
  return null;
}
async function gainExp(){
  const base=SP[bt.foe.id].x, g=Math.max(1,Math.floor(base*bt.foe.lv/7));
  const parts=G.party.filter(m=>m.hp>0);
  for(const m of parts){
    m.exp+=g;
    await say(nm(m)+'は '+g+' けいけんちを もらった!');
    while(m.lv<60 && m.exp>=expFor(m.lv+1)){
      grow(m,()=>{ m.lv++; });
      sfx('lvl'); ui.flashScreen=14;
      await say(nm(m)+'は レベル '+m.lv+'に あがった!');
      for(const [ml,mk_] of SP[m.id].lv){
        if(ml===m.lv && !m.mv.find(x=>x.k===mk_)) await learn(m,mk_);
      }
      const ev=SP[m.id].ev;
      if(ev && m.lv>=ev[1]) await evolve(m,ev[0]);
    }
  }
}
async function learn(m,key){
  if(m.mv.length<4){ m.mv.push({k:key,pp:MV[key].pp,mp:MV[key].pp});
    await say(nm(m)+'は '+MV[key].n+'を おぼえた!'); return; }
  await say(nm(m)+'は '+MV[key].n+'を おぼえたい! でも わざは 4つまで…',{keep:true});
  const items=m.mv.map(s=>({t:MV[s.k].n,r:MV[s.k].t})).concat([{t:'おぼえない',r:''}]);
  const c=await choose(items,{x:8,y:44,w:144,cols:1,title:'わすれる わざを えらぶ'});
  ui.text=null;
  if(c<0||c===4){ await say(nm(m)+'は '+MV[key].n+'を おぼえなかった。'); return; }
  const old=MV[m.mv[c].k].n;
  m.mv[c]={k:key,pp:MV[key].pp,mp:MV[key].pp};
  await say(nm(m)+'は '+old+'を わすれて '+MV[key].n+'を おぼえた!');
}
async function evolve(m,to){
  ui.evo={from:m.id,to,t:0};
  sfx('lvl');
  for(let i=0;i<70;i++){ ui.evo.t=i/70; await sleep(28); }
  grow(m,()=>{ m.id=to; m.name=SP[to].n; });

  await say('おめでとう! '+SP[m.id].n+'に しんかした!');

async function throwBall(key){
  const mul=ITEMS[key].ball;
  G.bag[key]--; if(G.bag[key]<=0) delete G.bag[key];
  await say(ITEMS[key].n+'を なげた!',{keep:true});
  bt.ball={y:0,t:0}; sfx('ball');
  for(let i=0;i<24;i++){ bt.ball.t=i/24; await sleep(20); }
  bt.anim.fh=1; bt.ball.hold=1; ui.text=null;
  const s=catchShakes(bt.foe,mul);
  for(let i=0;i<Math.min(s,3);i++){ sfx('tick'); bt.ball.shake=1; await sleep(160); bt.ball.shake=0; await sleep(320); }
  if(s>=4){
    sfx('catch'); await say('やった! '+nm(bt.foe)+'を つかまえた!');
    caught(bt.foe.id);
    const c=bt.foe; resetB(c);
    if(G.party.length<6){ G.party.push(c); await say(c.name+'は なかまに くわわった!'); }
    else { G.box.push(c); await say('てもちが いっぱい! '+c.name+'は ボックスへ おくられた。'); }
    bt.ball=null; return true;
  }
  bt.ball=null; bt.anim.fh=0; sfx('no');
  await say(['もうすこし だったのに!','おしい! あと ひといき!','ざんねん! ボールから でてしまった!','ダメだ! ぜんぜん つかまらない!'][Math.min(s,3)]);
  return false;
}
async function battle(o){
  const prev=scene; scene='battle'; ui.busy=true;
  const isTr=!!o.trainer;
  bt={tr:o.trainer||null, ei:0, wild:!isTr,
      foe:isTr?o.trainer.party[0]:o.wild, me:alive()[0],
      anim:{md:0,fd:0,mh:0,fh:0}, ball:null, intro:0};
  resetB(bt.me); resetB(bt.foe);
  bt.dm=bt.me.hp; bt.df=bt.foe.hp;
  seen(bt.foe.id);
  sfx('warp');
  for(let i=0;i<14;i++){ bt.intro=i/14; await sleep(28); }
  bt.intro=1;
  if(isTr){ await say(o.trainer.name+'が しょうぶを しかけてきた!');
    await say(o.trainer.name+'は '+nm(bt.foe)+'を くりだした!'); }
  else await say('あっ! やせいの '+nm(bt.foe)+'が とびだしてきた!');
  await say('ゆけっ! '+nm(bt.me)+'!');

  let running=true, result='';
  while(running){
    const act=await battleMenu();
    if(act.t==='run'){
      if(isTr){ await say('トレーナーせんから にげられない!'); }
      else{
        const odds=bt.me.spd*128/Math.max(1,bt.foe.spd)+30;
        if(Math.random()*256<odds){ await say('うまく にげきれた!'); result='run'; break; }
        await say('にげられない!');
      }
    } else if(act.t==='ball'){
      const ok=await throwBall(act.k);
      if(ok){ result='caught'; break; }
    } else if(act.t==='item'){
      // 使用済み。ターン消費
    } else if(act.t==='switch'){
      await say(nm(bt.me)+' もどれ!');
      bt.me=G.party[act.i]; resetB(bt.me); bt.dm=bt.me.hp;
      await say('ゆけっ! '+nm(bt.me)+'!');
    }
    // 相手のターン
    if(bt.foe.hp>0 && bt.me.hp>0){
      const fk=aiMove();
      if(act.t==='move'){
        const pm=MV[act.k], fm=MV[fk];
        const ps=bt.me.spd*(bt.me.st==='まひ'?0.5:1), fs=bt.foe.spd*(bt.foe.st==='まひ'?0.5:1);
        const meFirst=(pm.pr||0)!==(fm.pr||0)? (pm.pr||0)>(fm.pr||0) : (ps===fs?Math.random()<0.5:ps>fs);
        if(meFirst){ await useMove(true,act.k); if(bt.foe.hp>0) await useMove(false,fk); }
        else { await useMove(false,fk); if(bt.me.hp>0) await useMove(true,act.k); }
      } else await useMove(false,fk);
    }
    await endTurnStatus('me'); await endTurnStatus('foe');
    const f=await faintCheck();
    if(f==='foe'){
      await gainExp();
      if(isTr && bt.ei<o.trainer.party.length-1){
        bt.ei++; bt.foe=o.trainer.party[bt.ei]; resetB(bt.foe); bt.df=bt.foe.hp;
        bt.anim.fh=0; seen(bt.foe.id);
        await say(o.trainer.name+'は '+nm(bt.foe)+'を くりだした!');
      } else {
        if(isTr){
          const mn=o.trainer.money; G.money=Math.min(999999,G.money+mn);
          await say(o.trainer.name+'に かった!');
          await say('しょうきんとして '+mn+'えんを てにいれた!');
          for(const l of o.trainer.win) await say(l,{name:o.trainer.name});
          G.flags[o.trainer.key]=1;
          if(o.trainer.key.startsWith('t_forest')) G.flags.cleared=1;
        } else {
          const mn=bt.foe.lv*9+ri(5,30); G.money+=mn;
          await say('おかね '+mn+'えんを ひろった!');
        }
        result='win';
      }
      if(result) break;
    } else if(f==='me'){
      const rest=alive();
      if(!rest.length){ result='lose'; break; }
      await say('つぎの モンスターを えらんで ください。');
      const i=await pickParty({force:true});
      bt.me=G.party[i]; resetB(bt.me); bt.dm=bt.me.hp; bt.anim.mh=0;
      await say('ゆけっ! '+nm(bt.me)+'!');
    }
  }
  for(let i=14;i>=0;i--){ bt.intro=i/14; await sleep(24); }
  bt=null; scene='field'; ui.busy=false; ui.text=null;
  if(result==='lose'){
    ui.busy=true;
    await say('めのまえが まっくらに なった…');
    G.money=Math.floor(G.money/2);
    for(const m of G.party){ m.hp=m.max; m.st=null; m.slp=0; }
    G.map='town'; G.x=5; G.y=5; G.dir='up'; mv=null;
    await say('ハジマリの町の ナースに たすけられた。');
    await say('モンスターたちは かいふく した!');
    ui.busy=false;
  }
  if(result==='win'&&G.flags.cleared&&!G.flags.ending){
    G.flags.ending=1; ui.busy=true;
    await say('—— きみは ライバルを こえた。');
    await say('もりの おくへ つづく みちは まだ とざされている…');
    await say('つづきは また こんど! ぼうけんを たのしんで!');
    ui.busy=false; save();
  }
}

async function applyItem(m,k){
  const it=ITEMS[k];
  if(it.heal){
    if(m.hp<=0){ await say('ひんしの モンスターには つかえない!'); return false; }
    if(m.hp>=m.max){ await say(m.name+'の HPは まんたんだ!'); return false; }
    const h=Math.min(it.heal,m.max-m.hp); m.hp+=h; sfx('heal');
    if(bt&&bt.me===m) await tweenHp('me');
    G.bag[k]--; if(!G.bag[k]) delete G.bag[k];
    await say(m.name+'の HPが '+h+' かいふくした!'); return true;
  }
  if(it.rev){
    if(m.hp>0){ await say('ひんしでは ない!'); return false; }
    m.hp=Math.floor(m.max/2); m.st=null; sfx('heal');
    G.bag[k]--; if(!G.bag[k]) delete G.bag[k];
    await say(m.name+'は げんきを とりもどした!'); return true;
  }
  if(it.cure){
    if(!m.st){ await say(m.name+'は なんともない!'); return false; }
    m.st=null; m.slp=0; sfx('heal');
    G.bag[k]--; if(!G.bag[k]) delete G.bag[k];
    await say(m.name+'は げんきに なった!'); return true;
  }
  return false;
}

      const i=(m.top+r)*cols+c; if(i>=m.items.length) continue;

      /* 右のPP・数値と衝突しないよう名前側の最大幅を確保する */
      const rw=it.r?Math.max(20,tw(it.r,7)+6):2;
      T(it.t,tx,iy,{size:fsz,color:it.col||'#fff',max:Math.max(12,(ix+cw-rw)-tx)});
      if(it.r) T(it.r,ix+cw-4,iy+1,{size:7,align:'right',color:'#bdb8d6'});
    }
  }
  if(rows>view){
    T(m.top>0?'▲':' ',x+w-6,y+th+2,{size:6,color:'#f4b942'});
    T(m.top+view<rows?'▼':' ',x+w-6,y+h-9,{size:6,color:'#f4b942'});
  }
  if(m.dex){
    box(110,16,44,54);
    const id=ui.dexSel;
    if(id){ dspr(monSpr(id),116,20,2);
      T(SP[id].n,132,52,{size:7,align:'center'});
      fill(120,61,24,8,TY[SP[id].t]); T(SP[id].t,122,61.5,{size:5.5,color:'#1a1626',shadow:false}); }
    else T('???',132,40,{size:9,align:'center',color:'#6f6a90'});
  }
  if(m.pick3){
    for(let i=0;i<3;i++){
      const id=['mokuri','pochika','shizuku'][i], sx=14+i*48;
      if(i===m.idx){ box(sx-4,18,44,44,{bg:'rgba(244,185,66,.18)'}); }
      dspr(monSpr(id),sx,22,2);
      fill(sx+2,56,28,8,TY[SP[id].t]); T(SP[id].t,sx+4,56.5,{size:5.5,color:'#1a1626',shadow:false});
    }
  }
  if(ui.shopDesc){ box(3,118,154,23); T(ui.shopDesc,8,124,{size:8}); }
  if(m.items[m.idx]&&m.items[m.idx].mon&&!m.dex){
    box(112,y-1,42,42); dspr(monSpr(m.items[m.idx].mon),118,y+4,2);
  }
}
function drawDetail(){
  const m=ui.detail; if(!ui.showDetail||!m) return;
  box(4,6,152,132);
  dspr(monSpr(m.id),12,14,2.5);
  T(m.name,58,16,{size:11,weight:600});
  T('Lv '+m.lv,58,30,{size:9,color:'#c9c5e0'});
  fill(58,42,26,9,TY[SP[m.id].t]); T(SP[m.id].t,60,42.5,{size:6,color:'#1a1626',shadow:false});
  hpBar(58,58,90,m.hp,m.max);
  T('HP '+m.hp+'/'+m.max,58,64,{size:7,color:'#c9c5e0'});
  T('こうげき '+m.atk,12,78,{size:8}); T('ぼうぎょ '+m.def,84,78,{size:8});
  T('すばやさ '+m.spd,12,90,{size:8});
  const need=expFor(m.lv+1)-m.exp;
  T('つぎのLvまで '+Math.max(0,need),84,90,{size:8,color:'#c9c5e0'});
  fill(10,102,140,1,'#3f3b5c');
  for(let i=0;i<m.mv.length;i++){
    const s=m.mv[i], mo=MV[s.k], x=12+(i%2)*72, y=106+Math.floor(i/2)*13;
    fill(x,y+1,4,8,TY[mo.t]);
    T(mo.n,x+7,y,{size:8});
    T(s.pp+'/'+s.mp,x+66,y+1,{size:6.5,align:'right',color:'#bdb8d6'});
  }
  if(Math.sin(tick/7)>0) T('▼',147,129,{size:8,color:'#f4b942'});
}
function drawEvo(){
  const e=ui.evo; if(!e) return;
  p.fillStyle='#0d0b16'; p.fillRect(0,0,W,H);
  const t=e.t, ph=Math.sin(t*Math.PI*9)*0.5+0.5;
  const id=(t<0.9&&ph<0.5)?e.from:(t<0.9?e.to:e.to);
  const sc=3+Math.sin(t*Math.PI)*0.6;
  const sz=16*sc;
  drawSpr(monSpr(id),W/2-sz/2,52-sz/2+20,sc,false);
  p.fillStyle='rgba(244,185,66,'+(0.15+0.25*Math.sin(t*Math.PI))+')'; p.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2+t*7, r=20+t*70;
    p.fillStyle='#fff'; p.fillRect(W/2+Math.cos(a)*r,72+Math.sin(a)*r,2,2);
  }
}
function drawTitle(){
  const g=p;
  g.fillStyle='#1b2340'; g.fillRect(0,0,W,H);
  g.fillStyle='#2a3560'; g.fillRect(0,0,W,80);
  for(let i=0;i<26;i++){ const x=(i*37)%W, y=(i*23)%70; g.fillStyle=Math.sin(tick/20+i)>0?'#8fa8e0':'#5f74b0'; g.fillRect(x,y,1,1); }
  g.fillStyle='#243b2c'; g.beginPath(); g.moveTo(0,96); g.lineTo(44,66); g.lineTo(92,96); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(70,96); g.lineTo(120,60); g.lineTo(160,96); g.closePath(); g.fill();
  g.fillStyle='#2f5c3a'; g.fillRect(0,94,W,H-94);
  g.fillStyle='#3b7546'; g.fillRect(0,94,W,4);
  const b=Math.abs(Math.sin(tick/26))*4;
  drawSpr(monSpr('mokuri'),18,84-b,2,false);
  drawSpr(monSpr('pochika'),68,86-Math.abs(Math.sin(tick/26+2))*4,2,false);
  drawSpr(monSpr('shizuku'),118,84-Math.abs(Math.sin(tick/26+4))*4,2,false);
}
function drawTitleUI(){
  T('モンスター',80,18,{size:15,weight:700,align:'center',color:'#f4b942'});
  T('クエスト',80,36,{size:15,weight:700,align:'center',color:'#fff'});
  fill(38,55,84,1,'#f4b942');
  if(!ui.menu && Math.sin(tick/16)>-0.2)
    T('Aボタンで はじめる',80,64,{size:8,align:'center',color:'#c9c5e0'});
  T('MQ-01  ORIGINAL MONSTER RPG',80,134,{size:6,align:'center',color:'#6f6a90'});
}
function draw(){
  p.clearRect(0,0,W,H);
  if(ui.evo) drawEvo();
  else if(scene==='battle'&&bt) drawBattlePix();
  else if(scene==='title') drawTitle();
  else if(scene==='field') drawField();
  d.clearRect(0,0,disp.width,disp.height);
  d.imageSmoothingEnabled=false;
  d.drawImage(pix,0,0,disp.width,disp.height);
  if(ui.flashScreen>0){ ui.flashScreen--; d.fillStyle='rgba(255,255,255,'+(ui.flashScreen/26)+')'; d.fillRect(0,0,disp.width,disp.height); }
  if(scene==='title') drawTitleUI();
  if(scene==='battle'&&bt&&!ui.evo) drawBattleUI();
  if(ui.banner&&ui.banner.n>0){ ui.banner.n--;
    box(4,4,Math.max(50,tw(ui.banner.t,9)+16),18);
    T(ui.banner.t,12,9,{size:9,color:'#f4b942'}); }
  if(ui.prompt&&ui.menu){
    box(3,99,93,42);
    const ls=wrap(ui.prompt,84,8.5), y0=ls.length>1?107:114;
    for(let i=0;i<Math.min(ls.length,3);i++) T(ls[i],8,y0+i*11,{size:8.5});
  }
  drawTextBox();
  drawMenu();
  drawDetail();
  if(ui.fade>0){ d.fillStyle='rgba(0,0,0,'+ui.fade+')'; d.fillRect(0,0,disp.width,disp.height); }
}
/* ============================ 起動 ============================ */
async function opening(){
  ui.busy=true;
  await say('ようこそ! モンスターの せかいへ!',{name:'ハカセ'});
  await say('この せかいには ふしぎな いきものが たくさん くらしている。',{name:'ハカセ'});
  await say('きみも きょうから モンスタートレーナーだ!',{name:'ハカセ'});
  await say('さあ 1ぴき えらびなさい。',{name:'ハカセ',keep:true});
  ui.text=null;
  const ids=['mokuri','pochika','shizuku'];
  let c;
  while(true){
    c=await choose(ids.map(id=>({t:SP[id].n,r:SP[id].t})),{x:20,y:68,w:120,cols:1,pick3:1});
    await say(SP[ids[c]].n+'に きめますか?',{keep:true});
    const y=await choose(['はい','いいえ'],{x:104,y:36,w:48,cols:1,cancel:true});
    ui.text=null;
    if(y===0) break;
  }
  const id=ids[c];
  G.flags.starter=id;
  const s=mk(id,5); G.party.push(s); caught(id);
  sfx('catch');
  await say(SP[id].n+'を うけとった!');
  await say('その モンスターを たいせつに するんだよ。',{name:'ハカセ'});
  await say('きたの ルート1で しゅぎょうを つむと いい!',{name:'ハカセ'});
  ui.busy=false;
}
async function titleGo(){
  if(ui.menu||ui.busy) return;
  ui.busy=true;
  const opts=hasSave()?['つづきから','はじめから']:['はじめから'];
  const c=await choose(opts,{x:44,y:82,w:72,cols:1});
  if(hasSave()&&c===0){
    if(load()){ scene='field'; ui.busy=false; ui.banner={t:M().name,n:110}; return; }
  }
  if(hasSave()&&c===1){
    await say('いまの きろくは きえてしまいます。よろしいですか?',{keep:true});
    const y=await choose(['はい','いいえ'],{x:104,y:36,w:48,cols:1,cancel:true});
    ui.text=null;
    if(y!==0){ ui.busy=false; return; }
  }
  newGame(); scene='field'; ui.busy=false;
  await opening();
}
function loop(){
  tick++;
  try{
    if(scene==='field') updField();
    draw();
  }catch(e){ if(!loop.warned){ loop.warned=1; console.error(e); } }
  requestAnimationFrame(loop);
}
fit(); scene='title'; loop();
setInterval(()=>{ if(G&&scene==='field'&&!ui.busy) G.play++; },1000);

</script>
