<title>モンスタークエスト</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
:root{
  color-scheme: dark;
  --shell-1:#2f2c47; --shell-2:#211f33; --shell-3:#191727;
  --bezel:#100f19; --edge:#3f3b5c;
  --gold:#f4b942; --ink:#c9c5e0; --dim:#6f6a90;
  --btn:#3b3852; --btn-hi:#524e70; --btn-lo:#26243a;
  --a:#e0553f; --a-lo:#8d2f22; --b:#4a4766; --b-lo:#2c2a40;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #35314f 0%, #14131f 60%, #0b0a12 100%);
  color:var(--ink);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none; overscroll-behavior:none;
  display:flex; align-items:center; justify-content:center;
}
#device{
  width:100%; max-width:440px; height:100dvh; max-height:960px;
  padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:10px;
}
#body{
  flex:1; min-height:0;
  display:flex; flex-direction:column; gap:12px;
  padding:14px 14px 18px;
  border-radius:22px 22px 34px 34px;
  background:linear-gradient(178deg, var(--shell-1) 0%, var(--shell-2) 46%, var(--shell-3) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.13),
    inset 0 -3px 0 rgba(0,0,0,.4),
    0 18px 40px rgba(0,0,0,.55);
}
#spacer{ flex:1; min-height:0; }
#bezel{
  position:relative; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  background:var(--bezel); border-radius:12px 12px 26px 12px;
  padding:14px 12px 20px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.07);
}
#screen{ display:block; border-radius:2px; background:#0a0d0a; image-rendering:pixelated; }
#led{ position:absolute; left:14px; top:50%; width:7px; height:7px; border-radius:50%;
  background:var(--a); box-shadow:0 0 7px var(--a); transform:translateY(-50%); }
#mark{ position:absolute; right:12px; bottom:5px; font-size:9px; letter-spacing:.16em; color:#4a4666; }
#pad{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 4px; }
.dpad{ display:grid; grid-template-columns:repeat(3,42px); grid-template-rows:repeat(3,42px); }
.dpad>div{ display:flex; align-items:center; justify-content:center; }
.key{
  background:linear-gradient(180deg,var(--btn-hi),var(--btn));
  box-shadow:0 3px 0 var(--btn-lo), 0 5px 8px rgba(0,0,0,.45);
  border:none; color:var(--ink); width:100%; height:100%;
  display:flex; align-items:center; justify-content:center; font-size:13px;
}
.key:active,.key.on{ transform:translateY(3px); box-shadow:0 0 0 var(--btn-lo); filter:brightness(1.15); }
.key:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
#u{border-radius:8px 8px 0 0;} #d{border-radius:0 0 8px 8px;}
#l{border-radius:8px 0 0 8px;} #r{border-radius:0 8px 8px 0;}
#c{ background:var(--btn); box-shadow:inset 0 0 6px rgba(0,0,0,.5); }
.ab{ display:flex; gap:12px; align-items:flex-end; padding-bottom:6px; }
.round{ width:56px; height:56px; border-radius:50%; font-size:17px; font-weight:700; letter-spacing:.02em; }
#B{ background:linear-gradient(180deg,#5b5780,var(--b)); box-shadow:0 4px 0 var(--b-lo),0 6px 10px rgba(0,0,0,.45); margin-bottom:16px; }
#A{ background:linear-gradient(180deg,#ef7057,var(--a)); box-shadow:0 4px 0 var(--a-lo),0 6px 10px rgba(0,0,0,.45); }
#sys{ display:flex; justify-content:center; gap:16px; }
.pill{ width:74px; height:20px; border-radius:10px; font-size:10px; letter-spacing:.14em;
  background:linear-gradient(180deg,#46425f,#332f49); box-shadow:0 2px 0 #221f33; color:#9a95bb; }
#foot{ display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--dim); letter-spacing:.1em; padding:0 4px; }
#foot b{ color:var(--gold); font-weight:400; letter-spacing:.22em; }
#mute{ background:none; border:1px solid #3a3654; color:var(--dim); border-radius:5px; padding:3px 8px; font:inherit; font-size:10px; }
@media (max-height:620px){ .dpad{grid-template-columns:repeat(3,36px); grid-template-rows:repeat(3,36px);} .round{width:48px;height:48px;} }
</style>

<div id="device">
  <div id="body">
    <div id="bezel">
      <span id="led"></span>
      <canvas id="screen"></canvas>
      <span id="mark">MONSTER QUEST</span>
    </div>
    <div id="spacer"></div>
    <div id="pad">
      <div class="dpad">
        <div></div><div><button class="key" id="u" data-k="up" aria-label="上">▲</button></div><div></div>
        <div><button class="key" id="l" data-k="left" aria-label="左">◀</button></div><div><span class="key" id="c"></span></div><div><button class="key" id="r" data-k="right" aria-label="右">▶</button></div>
        <div></div><div><button class="key" id="d" data-k="down" aria-label="下">▼</button></div><div></div>
      </div>
      <div class="ab">
        <button class="key round" id="B" data-k="b">B</button>
        <button class="key round" id="A" data-k="a">A</button>
      </div>
    </div>
    <div id="sys">
      <button class="key pill" data-k="select">SELECT</button>
      <button class="key pill" data-k="start">START</button>
    </div>
  </div>
  <div id="foot"><b>MQ-01</b><button id="mute">SOUND ON</button></div>
</div>

<script>
"use strict";
/* スマホ表示の保険: viewport が head に無ければ補う */
(function(){
  if(!document.querySelector('head meta[name="viewport"]')){
    const m=document.createElement('meta'); m.name='viewport';
    m.content='width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no';
    document.head.appendChild(m);
  }
})();
/* ============================ 基盤 ============================ */
const W=160, H=144;
const disp=document.getElementById('screen'), d=disp.getContext('2d');
const pix=document.createElement('canvas'); pix.width=W; pix.height=H;
const p=pix.getContext('2d'); p.imageSmoothingEnabled=false;
const FONT='"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif';
let S=3;

function fit(){
  const body=document.getElementById('body'), bz=document.getElementById('bezel');
  const pad=document.getElementById('pad'), sys=document.getElementById('sys');
  const bs=getComputedStyle(body), zs=getComputedStyle(bz);
  const gap=parseFloat(bs.rowGap)||12;
  const aw=bz.clientWidth-parseFloat(zs.paddingLeft)-parseFloat(zs.paddingRight);
  const ah=body.clientHeight-parseFloat(bs.paddingTop)-parseFloat(bs.paddingBottom)
         -pad.offsetHeight-sys.offsetHeight-gap*3
         -parseFloat(zs.paddingTop)-parseFloat(zs.paddingBottom);
  if(aw<40||ah<40) return;
  const cw=Math.floor(Math.min(aw, ah*W/H)), ch=Math.round(cw*H/W);
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const s=Math.max(2,Math.min(8,Math.ceil(cw*dpr/W)));
  /* 変化が無ければ何もしない。loop から定期的に呼ばれる前提 */
  if(s===S && disp.width===W*S && disp.style.width===cw+'px') return;
  S=s; disp.width=W*S; disp.height=H*S;
  disp.style.width=cw+'px'; disp.style.height=ch+'px';
  d.imageSmoothingEnabled=false; d.textBaseline='top';
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,150));
addEventListener('load',()=>{ fit(); setTimeout(fit,60); });
if(window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('body'));

/* 描画ヘルパ（論理座標→デバイス座標） */
function T(str,x,y,o){
  o=o||{}; const sz=o.size||9, mx=o.max?o.max*S:undefined;
  d.font=(o.weight||400)+' '+(sz*S)+'px '+FONT;
  d.textAlign=o.align||'left';
  if(o.shadow!==false){ d.fillStyle=o.shadow||'rgba(0,0,0,.55)';
    d.fillText(str,x*S+Math.max(1,S*0.35),y*S+Math.max(1,S*0.35),mx); }
  d.fillStyle=o.color||'#fff'; d.fillText(str,x*S,y*S,mx);
  d.textAlign='left';
}
function tw(str,size){ d.font='400 '+(size*S)+'px '+FONT; return d.measureText(str).width/S; }
function box(x,y,w,h,o){
  o=o||{};
  d.fillStyle=o.bg||'rgba(16,14,26,.92)';
  rr(x*S,y*S,w*S,h*S,3*S); d.fill();
  d.lineWidth=Math.max(1,S); d.strokeStyle=o.line||'#e8e4ff'; d.stroke();
  if(o.inner!==false){ d.lineWidth=Math.max(1,S*0.5); d.strokeStyle='rgba(120,112,170,.5)';
    rr(x*S+2*S,y*S+2*S,(w-4)*S,(h-4)*S,2*S); d.stroke(); }
}
function rr(x,y,w,h,r){ d.beginPath(); d.moveTo(x+r,y); d.arcTo(x+w,y,x+w,y+h,r); d.arcTo(x+w,y+h,x,y+h,r); d.arcTo(x,y+h,x,y,r); d.arcTo(x,y,x+w,y,r); d.closePath(); }
function fill(x,y,w,h,c){ d.fillStyle=c; d.fillRect(x*S,y*S,w*S,h*S); }
function wrap(str,width,size){
  const out=[]; let line='';
  for(const ch of str){
    if(ch==='\n'){ out.push(line); line=''; continue; }
    if(tw(line+ch,size)>width && line){ out.push(line); line=ch; } else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============================ 音 ============================ */
let AC=null, muted=false, master=null, gBgm=null, gSfx=null, noiseBuf=null;
function audio(){
  if(AC) return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.85; master.connect(AC.destination);
    gBgm=AC.createGain(); gBgm.gain.value=0.20; gBgm.connect(master);
    gSfx=AC.createGain(); gSfx.gain.value=0.55; gSfx.connect(master);
  }catch(e){ AC=null; }
  return AC;
}
const mf=n=>440*Math.pow(2,(n-69)/12);
function nzSrc(){
  if(!noiseBuf){
    const n=Math.floor(AC.sampleRate*0.7);
    noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
    const dd=noiseBuf.getChannelData(0);
    for(let i=0;i<n;i++) dd[i]=Math.random()*2-1;
  }
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s;
}
/* 単音。f2 を渡すと周波数をスライドさせる */
function tone(o){
  if(!audio()||muted) return;
  const t0=o.t||AC.currentTime, dur=o.d||0.1;
  const osc=AC.createOscillator(); osc.type=o.w||'square';
  osc.frequency.setValueAtTime(o.f,t0);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+dur);
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(o.g||0.18,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0006,t0+dur);
  osc.connect(g); g.connect(o.out||gSfx);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
/* ノイズ。打撃音・風・爆ぜる音のもと */
function nz(o){
  if(!audio()||muted) return;
  const t0=o.t||AC.currentTime, dur=o.d||0.1;
  const s=nzSrc(), f=AC.createBiquadFilter();
  f.type=o.ft||'bandpass'; f.Q.value=o.q||1;
  f.frequency.setValueAtTime(o.f,t0);
  if(o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(30,o.f2),t0+dur);
  const g=AC.createGain();
  g.gain.setValueAtTime(o.g||0.25,t0);
  g.gain.exponentialRampToValueAtTime(0.0006,t0+dur);
  s.connect(f); f.connect(g); g.connect(o.out||gSfx);
  s.start(t0); s.stop(t0+dur+0.03);
}
function sfx(kind){
  if(muted||!audio()) return;
  if(AC.state==='suspended') AC.resume();
  const spec={
    tick:[[880,0.04]], ok:[[660,0.05],[990,0.07]], no:[[220,0.12]],
    faint:[[440,0.08],[330,0.08],[220,0.16]], heal:[[520,0.06],[660,0.06],[880,0.1]],
    ball:[[440,0.05],[560,0.05]], catch:[[523,0.09],[659,0.09],[784,0.09],[1046,0.2]],
    lvl:[[523,0.07],[659,0.07],[784,0.14]], warp:[[300,0.05],[500,0.05],[700,0.05]]
  }[kind];
  if(kind==='hit'){ nz({f:900,f2:180,d:0.18,g:0.35,ft:'lowpass'}); tone({f:160,f2:70,d:0.14,g:0.2}); return; }
  if(kind==='crit'){ nz({f:2000,f2:200,d:0.3,g:0.45,ft:'lowpass'}); tone({f:300,f2:60,d:0.25,w:'sawtooth',g:0.22}); return; }
  let t=AC.currentTime;
  for(const s of (spec||[[600,0.04]])){ tone({f:s[0],d:s[1],g:0.16,t}); t+=s[1]; }
}
/* タイプごとの攻撃SE */
function moveSE(ty){
  if(muted||!audio()) return;
  const T=AC.currentTime;
  switch(ty){
    case 'ほのお': nz({f:900,f2:160,d:0.5,g:0.42,ft:'lowpass',q:3});
      tone({f:240,f2:60,d:0.4,w:'sawtooth',g:0.14}); break;
    case 'みず': for(let i=0;i<5;i++) tone({f:1000-i*140,d:0.13,w:'sine',g:0.2,t:T+i*0.055});
      nz({f:1400,f2:380,d:0.35,g:0.22,q:1.5}); break;
    case 'くさ': for(let i=0;i<3;i++) nz({f:2800,f2:900,d:0.14,g:0.32,q:7,t:T+i*0.1}); break;
    case 'でんき': for(let i=0;i<7;i++) tone({f:500*Math.pow(1.6,i%3),d:0.05,w:'square',g:0.16,t:T+i*0.035});
      nz({f:3500,f2:1000,d:0.4,g:0.26,q:2}); break;
    case 'いわ': nz({f:320,f2:70,d:0.45,g:0.5,ft:'lowpass',q:1});
      tone({f:110,f2:45,d:0.35,w:'square',g:0.2}); break;
    case 'むし': tone({f:280,f2:560,d:0.2,w:'square',g:0.18});
      nz({f:2000,d:0.12,g:0.22,q:5,t:T+0.16}); break;
    case 'ひこう': nz({f:350,f2:3000,d:0.32,g:0.3,q:1.5});
      tone({f:600,f2:1400,d:0.28,w:'sine',g:0.1}); break;
    case 'こおり': for(let i=0;i<4;i++) tone({f:1600+i*260,d:0.09,w:'triangle',g:0.16,t:T+i*0.05});
      nz({f:5200,f2:2400,d:0.4,g:0.2,q:6}); break;
    case 'ドラゴン': tone({f:90,f2:220,d:0.55,w:'sawtooth',g:0.22});
      nz({f:600,f2:120,d:0.5,g:0.3,ft:'lowpass',q:2}); break;
    case 'ゴースト': tone({f:420,f2:150,d:0.55,w:'sine',g:0.18});
      tone({f:430,f2:160,d:0.55,w:'sine',g:0.14,t:T+0.02});
      nz({f:900,f2:200,d:0.45,g:0.14,ft:'lowpass',q:4}); break;
    case 'あく': nz({f:260,f2:60,d:0.5,g:0.36,ft:'lowpass',q:2});
      tone({f:150,f2:70,d:0.4,w:'square',g:0.12}); break;
    case 'はがね': tone({f:2400,f2:1200,d:0.18,w:'square',g:0.14});
      nz({f:4200,f2:1800,d:0.3,g:0.24,q:9});
      tone({f:180,f2:90,d:0.3,w:'square',g:0.16,t:T+0.03}); break;
    case 'かくとう': nz({f:700,f2:180,d:0.16,g:0.4,ft:'lowpass',q:2});
      nz({f:700,f2:180,d:0.16,g:0.34,ft:'lowpass',q:2,t:T+0.12});
      tone({f:200,f2:80,d:0.22,w:'square',g:0.18}); break;
    case 'エスパー': for(let i=0;i<6;i++) tone({f:700*Math.pow(1.18,i),d:0.11,w:'sine',g:0.13,t:T+i*0.05});
      nz({f:2600,f2:900,d:0.45,g:0.14,q:8}); break;
    default: sfx('hit');
  }
}
/* ---------- BGM（簡易シーケンサ） ---------- */
const seq=s=>s.split(' ').map(x=>x==='-'?0:+x);
const SONGS={
  title:{bpm:96,g:0.13,tr:[
    {w:'square',g:0.13,p:seq('72 - 76 79 - 84 - - 83 - 79 - 76 - - - 74 - 77 81 - 86 - - 84 - 81 - 79 - - -')},
    {w:'triangle',g:0.16,p:seq('48 - 48 - 55 - 55 - 53 - 53 - 47 - 47 - 50 - 50 - 57 - 57 - 55 - 55 - 55 - 55 -')}],
    dr:'h-h-h-h-h-h-h-h-h-h-h-h-h-h-h-h-'.split('')},
  town:{bpm:104,g:0.12,tr:[
    {w:'square',g:0.11,p:seq('72 - - 76 - - 79 - 76 - - 72 - - - - 74 - - 77 - - 81 - 79 - - 76 - - - -')},
    {w:'triangle',g:0.15,p:seq('48 - 55 - 48 - 55 - 53 - 60 - 53 - 60 - 50 - 57 - 50 - 57 - 55 - 62 - 55 - 55 -')}],
    dr:'--h---h---h---h---h---h---h---h-'.split('')},
  city:{bpm:120,g:0.12,tr:[
    {w:'square',g:0.11,p:seq('79 - 81 83 - 86 - 83 - 81 - 79 - 76 - - 77 - 79 81 - 84 - 81 - 79 - 77 - 74 - -')},
    {w:'triangle',g:0.15,p:seq('52 - 59 - 52 - 59 - 50 - 57 - 50 - 57 - 53 - 60 - 53 - 60 - 55 - 62 - 55 - 55 -')}],
    dr:'k-h-s-h-k-h-s-h-k-h-s-h-k-h-s-h-'.split('')},
  route:{bpm:134,g:0.12,tr:[
    {w:'square',g:0.11,p:seq('76 78 79 - 83 - 79 - 76 78 79 - 81 - - - 74 76 77 - 81 - 77 - 79 - 76 - 72 - - -')},
    {w:'triangle',g:0.15,p:seq('40 - 47 - 40 - 47 - 45 - 52 - 45 - 52 - 42 - 49 - 42 - 49 - 43 - 50 - 43 - 43 -')}],
    dr:'k-h-s-h-k-h-s-h-k-h-s-h-k-hks-h-'.split('')},
  forest:{bpm:92,g:0.12,tr:[
    {w:'triangle',g:0.14,p:seq('69 - 72 - 76 - 74 - 72 - - - 69 - - - 67 - 71 - 74 - 72 - 71 - - - 69 - - -')},
    {w:'sine',g:0.16,p:seq('45 - - - 52 - - - 45 - - - 52 - - - 43 - - - 50 - - - 45 - - - 45 - - -')}],
    dr:'----h-------h-------h-------h---'.split('')},
  cave:{bpm:78,g:0.13,tr:[
    {w:'triangle',g:0.13,p:seq('60 - - - 63 - - - 65 - - - 63 - - - 58 - - - 60 - - - 63 - - - - - - -')},
    {w:'sine',g:0.18,p:seq('36 - - - - - - - 41 - - - - - - - 34 - - - - - - - 36 - - - - - - -')}],
    dr:'--------k-----------------k-----'.split('')},
  battle:{bpm:152,g:0.13,tr:[
    {w:'square',g:0.12,p:seq('69 69 - 69 72 - 71 - 69 - 67 - 69 - - - 69 69 - 69 74 - 72 - 71 - 69 - 67 - - -')},
    {w:'triangle',g:0.15,p:seq('45 45 45 45 45 45 45 45 44 44 44 44 44 44 44 44 43 43 43 43 43 43 43 43 45 45 45 45 45 45 45 45')}],
    dr:'khshkhshkhshkhshkhshkhshkhshkhsh'.split('')},
  boss:{bpm:170,g:0.14,tr:[
    {w:'sawtooth',g:0.09,p:seq('76 - 75 - 76 - 75 - 76 - 71 - 74 - 72 - 69 - 72 - 76 - 79 - 81 - 79 - 76 - - -')},
    {w:'square',g:0.13,p:seq('40 40 40 40 40 40 40 40 39 39 39 39 39 39 39 39 38 38 38 38 38 38 38 38 40 40 40 40 40 40 40 40')}],
    dr:'khshkhshkhshkhshkhshkhshkhshkhsh'.split('')},
  /* ジムリーダー: 明るく前へ押す。勝てそうで勝てない緊張感 */
  gym:{bpm:160,g:0.13,tr:[
    {w:'square',g:0.12,p:seq('74 - 74 76 77 - 77 - 79 - 81 - 79 - 77 - 76 - 76 77 79 - 79 - 81 - 83 - 81 - - -')},
    {w:'triangle',g:0.15,p:seq('50 50 50 50 50 50 50 50 53 53 53 53 53 53 53 53 55 55 55 55 55 55 55 55 57 57 57 57 57 57 57 57')}],
    dr:'khshkhshkhshkhshkhshkhshkhshkhsh'.split('')},
  /* 四天王: 儀式めいた短調。半音でじりじり詰める */
  elite:{bpm:144,g:0.14,tr:[

let bgm={name:null,step:0,at:0,timer:null};
function bgmStop(){ if(bgm.timer){ clearInterval(bgm.timer); bgm.timer=null; } bgm.name=null; }
function bgmPlay(name){
  if(bgm.name===name) return;
  bgmStop();
  if(!name||muted||!audio()) return;
  if(AC.state==='suspended') AC.resume();
  bgm.name=name; bgm.step=0; bgm.at=AC.currentTime+0.08;
  bgm.timer=setInterval(bgmTick,40);
  bgmTick();
}
function bgmTick(){
  const s=SONGS[bgm.name];
  if(!s||muted||!AC){ bgmStop(); return; }
  const spb=30/s.bpm;                       /* 8分音符 1つぶんの秒数 */
  while(bgm.at<AC.currentTime+0.25){
    const i=bgm.step;
    for(const tr of s.tr){
      const n=tr.p[i%tr.p.length];
      if(n) tone({f:mf(n),d:spb*1.7,w:tr.w,g:tr.g,t:bgm.at,out:gBgm});
    }
    const dv=s.dr&&s.dr.length?s.dr[i%s.dr.length]:null;
    if(dv==='k') nz({f:150,f2:45,d:0.13,g:0.3,ft:'lowpass',t:bgm.at,out:gBgm});
    else if(dv==='s') nz({f:1900,f2:600,d:0.13,g:0.2,t:bgm.at,out:gBgm});
    else if(dv==='h') nz({f:7000,d:0.035,g:0.09,q:1,t:bgm.at,out:gBgm});
    bgm.at+=spb; bgm.step++;
  }
}

}

const held={up:0,down:0,left:0,right:0};

let waitA=null, scene='boot';

function press(k){
  sfx(k==='a'?'ok':'tick');
  if(ui.text && !ui.text.done){ ui.text.n=ui.text.full.length; return; }
  if(ui.qty){ qtyKey(k); return; }
  if(ui.menu){ menuKey(k); return; }
  if(waitA && (k==='a'||k==='b')){ const r=waitA; waitA=null; r(); return; }
  if(ui.busy) return;
  if(scene==='field'){
    if(k==='a') interact();
    else if(k==='b'||k==='start') openMenu();
  } else if(scene==='title'){ if(k==='a'||k==='start') titleGo(); }
}
function menuKey(k){
  const m=ui.menu, n=m.items.length, cols=m.cols||1;
  if(k==='up') m.idx=(m.idx-cols+n)%n;
  else if(k==='down') m.idx=(m.idx+cols)%n;
  else if(k==='left') m.idx=(m.idx-1+n)%n;
  else if(k==='right') m.idx=(m.idx+1)%n;
  else if(k==='a'){ if(m.items[m.idx].dis){ sfx('no'); return; } const r=m.res; ui.menu=null; r(m.idx); }
  else if(k==='b'||k==='start'){ if(m.cancel){ const r=m.res; ui.menu=null; sfx('no'); r(-1); } else sfx('no'); }
  if(m.onMove) m.onMove(m.idx);
}
function waitPress(){ return new Promise(r=>{ waitA=r; }); }
/* 数量えらび。▲▼で1つずつ、◀▶で10ずつ動かす */
function qtyKey(k){
  const q=ui.qty, was=q.n;
  if(k==='up') q.n=Math.min(q.max,q.n+1);
  else if(k==='down') q.n=Math.max(1,q.n-1);
  else if(k==='right') q.n=Math.min(q.max,q.n+10);
  else if(k==='left') q.n=Math.max(1,q.n-10);
  else if(k==='a'){ const r=q.res; ui.qty=null; r(q.n); return; }
  else if(k==='b'||k==='start'){ const r=q.res; ui.qty=null; sfx('no'); r(0); return; }
  if(q.n===was&&(k==='up'||k==='right')) sfx('no');
}
function pickQty(name,price,max){
  return new Promise(r=>{ ui.qty={n:1,max:Math.max(1,max),price,name,res:r}; });
}
function choose(items,o){
  o=o||{};
  return new Promise(r=>{ ui.menu=Object.assign({items:items.map(x=>typeof x==='string'?{t:x}:x), idx:o.idx||0, res:r}, o); });
}
async function say(txt,o){
  o=o||{};
  ui.text={full:txt, n:0, done:false, name:o.name||null};
  while(ui.text && ui.text.n<txt.length){ ui.text.n+=2; await sleep(22); }
  if(!ui.text) return;
  ui.text.n=txt.length; ui.text.done=true;
  if(!o.keep) { await waitPress(); ui.text=null; }
}

const DEXORDER=Object.keys(SP);

/* ============================ 個体生成 ============================ */
function expFor(l){ return l*l*l; }
function statHP(b,l){ return Math.floor(b*2*l/100)+l+10; }
function statOf(b,l){ return Math.floor(b*2*l/100)+5; }
function movesAt(id,l){
  const out=[];
  for(const [ml,mv] of SP[id].lv) if(ml<=l){ if(!out.includes(mv)) out.push(mv); }
  return out.slice(-4);
}
function mk(id,l){
  const s=SP[id], m={id,lv:l,name:s.n,st:null,slp:0,
    mv:movesAt(id,l).map(k=>({k,pp:MV[k].pp,mp:MV[k].pp}))};
  m.max=statHP(s.b[0],l); m.hp=m.max;
  m.atk=statOf(s.b[1],l); m.def=statOf(s.b[2],l); m.spd=statOf(s.b[3],l);
  m.exp=expFor(l);
  return m;
}
/* ステータス再計算。現在HPは呼び出し側が「増えた分だけ加算」する（最大値は超えない） */
function recalc(m){
  const s=SP[m.id];
  m.max=statHP(s.b[0],m.lv);
  m.atk=statOf(s.b[1],m.lv); m.def=statOf(s.b[2],m.lv); m.spd=statOf(s.b[3],m.lv);
  if(m.hp>m.max) m.hp=m.max;
}
function grow(m,fn){ const oh=m.max; fn(); recalc(m); m.hp=clamp(m.hp+(m.max-oh),0,m.max); }

function heroPal(k){ const c=PAL[k]||PAL.hero; return {'0':c[0],'1':c[1],'2':c[2],'3':c[3],'4':c[4],'7':'#241a2e','6':'#ffffff'}; }

const CACHE=new Map();
function bake(rows,pal,key){
  if(CACHE.has(key)) return CACHE.get(key);
  const cv=document.createElement('canvas'); cv.width=16; cv.height=16;
  const g=cv.getContext('2d');
  for(let y=0;y<rows.length;y++){
    const r=rows[y];
    for(let x=0;x<r.length;x++){
      const ch=r[x]; if(ch==='.'||ch===' ') continue;
      const col=pal[ch]; if(!col) continue;
      g.fillStyle=col; g.fillRect(x,y,1,1);
    }
  }
  CACHE.set(key,cv); return cv;
}
function monSpr(id){ return bake(ART[id],monPal(id),'m'+id); }
function heroSpr(k,dir){
  const dd=(dir==='left'||dir==='right')?'side':(HERO[dir]?dir:'down');
  return bake(HERO[dd],heroPal(k),'h'+k+dd);
}
function drawSpr(cv,x,y,sc,flip,ctx){
  const g=ctx||p; g.imageSmoothingEnabled=false;
  g.save();
  if(flip){ g.translate(x+16*sc,y); g.scale(-1,1); g.drawImage(cv,0,0,16*sc,16*sc); }
  else g.drawImage(cv,x,y,16*sc,16*sc);
  g.restore();
}

function buildHouses(){
  for(const k of Object.keys(MAPS)){
    const m=MAPS[k];
    if(!HOUSE_TALK[k]) continue;
    let idx=0;
    m.rows.forEach((row,y)=>{
      for(let x=0;x<row.length;x++){
        if(row[x]!=='D') continue;
        const key=k+'_h'+idx;
        const talk=HOUSE_TALK[k][idx%HOUSE_TALK[k].length];
        const npcs=[{x:4,y:2,pal:idx%2?'girl':'boy',dir:'down',nm:talk[0],say:talk[1]}];
        /* 町にひとつだけ、道具をくれる人を置く */
        if(idx===0&&HOUSE_GIFT[k]){
          const g=HOUSE_GIFT[k];
          npcs[0]={x:4,y:2,pal:idx%2?'girl':'boy',dir:'down',nm:talk[0],
                   gift:{item:g[0],flag:'gift_'+k,msg:g[1]},say:talk[1]};
        }
        /* 出口は扉の1マス下。塞がっていれば扉の位置へ戻す */
        const below=(m.rows[y+1]&&!SOLID.includes(m.rows[y+1][x]))?y+1:y;
        MAPS[key]={name:MAPS[k].name,rows:HOUSE_ROWS.slice(),ground:'f',
          warps:[{x:4,y:7,to:k,tx:x,ty:below}],npcs,signs:{},enc:null,indoor:1};
        MAPS[key].key=key;
        MAPBGM[key]=MAPBGM[k]||'town';
        m.warps.push({x,y,to:key,tx:4,ty:6});
        idx++;
      }
    });
  }
}
buildHouses();

/* ============================ つり ============================ */
/* みずタイルに むかって A。つりざおが あれば みずのモンスターが つれる */
const FISHDEF={lv:[10,22],list:[['pukari',30],['awabee',30],['shizuku',15],['uzushio',10],['ooawabi',10],['shinkaio',5]]};
function waitPressMs(ms){
  return new Promise(r=>{
    let done=false;
    waitA=()=>{ if(done) return; done=true; r(true); };
    setTimeout(()=>{ if(done) return; done=true; if(waitA) waitA=null; r(false); },ms);
  });
}
async function fishOrLook(){
  if(!G.bag.rod){ runScript(['みずうみだ。とても きれいだ。']); return; }
  if(!alive().length){ runScript(['たたかえる モンスターが いない!']); return; }
  ui.busy=true;
  await say('つりざおを おろした…',{keep:true});
  await sleep(ri(1100,3000));
  if(!ui.text){ ui.busy=false; return; }
  ui.text=null; ui.fish=1; sfx('ok');
  const hit=await waitPressMs(950);
  ui.fish=0;
  if(!hit){ await say('…にげられて しまった。'); ui.busy=false; return; }
  const mp=M(), tbl=mp.fish||FISHDEF;
  const tot=tbl.list.reduce((a,b)=>a+b[1],0);
  let r=Math.random()*tot, id=tbl.list[0][0];
  for(const q of tbl.list){ r-=q[1]; if(r<=0){ id=q[0]; break; } }
  await say('おっと! なにか かかった!');
  ui.busy=false;
  battle({wild:mk(id,ri(tbl.lv[0],tbl.lv[1]))});
}

async function pickItem(x,y){
  const mp=M(), key='i_'+mp.key+'_'+x+'_'+y;
  const it=(mp.items||{})[x+','+y]||'potion';
  ui.busy=true;
  G.flags[key]=1;
  G.bag[it]=(G.bag[it]||0)+1;
  sfx('catch');
  await say(ITEMS[it].n+'を みつけた!');
  ui.busy=false;
}


/* ============================ タイル描画 ============================ */
function hsh(x,y,s){ let n=(x*374761393+y*668265263+(s||0)*1274126177)|0; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967296; }
let tick=0;
function drawTile(ch,px_,py,wx,wy){
  const g=p;
  switch(ch){
    case 'W':{
      g.fillStyle='#2f5fb8'; g.fillRect(px_,py,16,16);
      g.fillStyle='#3f78d8'; g.fillRect(px_,py+4,16,4); g.fillRect(px_,py+12,16,3);
      const o=Math.floor(Math.sin(tick/22+wx*0.9+wy*0.5)*3);
      g.fillStyle='#8fc4ff'; g.fillRect(px_+3+o,py+5,5,1); g.fillRect(px_+9-o,py+13,4,1);
      break;}
    case 'V':{                                       /* うずしお */
      g.fillStyle='#1d3f80'; g.fillRect(px_,py,16,16);
      const t=tick/9+wx+wy;
      g.fillStyle='#2f5fb8'; g.fillRect(px_+1,py+1,14,14);
      for(let i=0;i<3;i++){
        const rr=5-i*1.6, a=t+i*2.1;
        g.fillStyle=i===0?'#8fc4ff':i===1?'#5f9ae8':'#3f78d8';
        g.fillRect(px_+8+Math.round(Math.cos(a)*rr)-1,py+8+Math.round(Math.sin(a)*rr)-1,3,3);
        g.fillRect(px_+8-Math.round(Math.cos(a)*rr)-1,py+8-Math.round(Math.sin(a)*rr)-1,2,2);
      }
      g.fillStyle='#0e2450'; g.fillRect(px_+7,py+7,2,2);
      break;}
    case 'R': g.fillStyle='#c4ab7e'; g.fillRect(px_,py,16,16);
      g.fillStyle='#b09468'; for(let i=0;i<5;i++){ const r=hsh(wx,wy,i); g.fillRect(px_+Math.floor(r*15),py+Math.floor(hsh(wx,wy,i+9)*15),2,1); }
      break;
    case 'H':{
      const up=tileAt(M(),wx,wy-1);
      if(up!=='H'&&up!=='D'){                       /* 建物の最上段は屋根 */
        g.fillStyle='#9c4f5c'; g.fillRect(px_,py,16,16);
        g.fillStyle='#b25f6c'; g.fillRect(px_,py+1,16,4);
        g.fillStyle='#7d3b47'; g.fillRect(px_,py+9,16,3);
        g.fillStyle='#5c2932'; g.fillRect(px_,py+12,16,4);
        g.fillStyle='#c97a85'; g.fillRect(px_+2,py+1,5,1); g.fillRect(px_+10,py+6,4,1);
      } else {
        g.fillStyle='#c99a72'; g.fillRect(px_,py,16,16);
        g.fillStyle='#b3835d'; for(let r=0;r<4;r++) g.fillRect(px_,py+r*4+3,16,1);
        for(let r=0;r<4;r++) g.fillRect(px_+(r%2?4:12),py+r*4,1,4);
        g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(px_,py,16,2);
        if(hsh(wx,wy,3)>0.6){ g.fillStyle='#3a2a1e'; g.fillRect(px_+3,py+4,10,8);
          g.fillStyle='#8fc0ee'; g.fillRect(px_+4,py+5,8,6);
          g.fillStyle='#c9e2fa'; g.fillRect(px_+4,py+5,4,3);
          g.fillStyle='#3a2a1e'; g.fillRect(px_+7,py+5,1,6); g.fillRect(px_+4,py+7,8,1); }
      }
      break;}
    case 'D': g.fillStyle='#6b4326'; g.fillRect(px_,py,16,16);
      g.fillStyle='#8a5c36'; g.fillRect(px_+2,py+1,12,15);
      g.fillStyle='#5a361e'; g.fillRect(px_+7,py+1,1,15);
      g.fillStyle='#f0d060'; g.fillRect(px_+10,py+8,2,2);
      break;
    case 'S': g.fillStyle='#5fa64a'; g.fillRect(px_,py,16,16);
      g.fillStyle='#6b4326'; g.fillRect(px_+7,py+9,2,6);
      g.fillStyle='#a5763f'; g.fillRect(px_+2,py+2,12,8);
      g.fillStyle='#6b4326'; g.fillRect(px_+3,py+4,10,1); g.fillRect(px_+3,py+6,7,1);
      break;
    case '#': g.fillStyle='#5fa64a'; g.fillRect(px_,py,16,16);
      g.fillStyle='#8a857c'; g.fillRect(px_+1,py+3,14,12);
      g.fillStyle='#a8a29a'; g.fillRect(px_+2,py+4,12,5);
      g.fillStyle='#5d5952'; g.fillRect(px_+1,py+13,14,2); g.fillRect(px_+6,py+8,5,2);
      break;
    case 'T':{
      const v=hsh(wx,wy,11), o=v>0.66?1:v>0.33?0:-1;   /* 樹形に3種のゆらぎ */
      g.fillStyle='#5fa64a'; g.fillRect(px_,py,16,16);
      g.fillStyle='#4e8d3d'; g.fillRect(px_+3,py+13,10,2);
      g.fillStyle='#4a2f1c'; g.fillRect(px_+6,py+10,4,5);
      g.fillStyle='#3a2415'; g.fillRect(px_+8,py+10,2,5);
      g.fillStyle='#1f5c2c'; g.fillRect(px_+2,py+1+(o<0?1:0),12,10); g.fillRect(px_+1,py+3,14,6);
      g.fillStyle='#2f8a3e'; g.fillRect(px_+3+(o>0?1:0),py+2,9,6);
      g.fillStyle='#49b055'; g.fillRect(px_+4+(o>0?1:0),py+3,4,3);
      g.fillStyle='#17462180'; g.fillRect(px_+2,py+9,12,2);
      break;}
    case '_':                                        /* 洞窟の岩壁 */
      g.fillStyle='#3a3038'; g.fillRect(px_,py,16,16);
      g.fillStyle='#4c4048'; g.fillRect(px_+1,py+1,14,10);
      g.fillStyle='#5e5058'; g.fillRect(px_+2,py+2,7,4);
      g.fillStyle='#241d24'; g.fillRect(px_,py+12,16,4); g.fillRect(px_+9,py+4,4,5);
      break;
    case 'f':                                        /* 屋内の床 */
      g.fillStyle=((wx+wy)&1)?'#5c5470':'#544c66'; g.fillRect(px_,py,16,16);
      g.fillStyle='#6a6280'; g.fillRect(px_,py,16,1); g.fillRect(px_,py,1,16);
      break;
    case 'w':                                        /* 屋内の壁 */
      g.fillStyle='#3a3450'; g.fillRect(px_,py,16,16);
      g.fillStyle='#4a4468'; g.fillRect(px_+1,py+1,14,9);
      g.fillStyle='#2a2540'; g.fillRect(px_,py+11,16,5);
      g.fillStyle='#5a5480'; g.fillRect(px_+2,py+2,6,3);
      break;
    case 'e':                                        /* 出口のマット */
      g.fillStyle='#5c5470'; g.fillRect(px_,py,16,16);
      g.fillStyle='#c04030'; g.fillRect(px_+1,py+3,14,10);
      g.fillStyle='#e06048'; g.fillRect(px_+2,py+4,12,4);
      g.fillStyle='#f0d060'; g.fillRect(px_+5,py+7,6,2);
      break;
    case 'Y':{                                       /* ジムの入口 */
      g.fillStyle='#6b4326'; g.fillRect(px_,py,16,16);
      g.fillStyle='#8a5c36'; g.fillRect(px_+1,py+1,14,15);
      g.fillStyle='#5a361e'; g.fillRect(px_+7,py+3,2,13);
      g.fillStyle='#f0d060'; g.fillRect(px_+2,py+1,12,3);
      g.fillStyle='#20161f'; g.fillRect(px_+4,py+2,2,1); g.fillRect(px_+8,py+2,4,1);
      break;}
    case '1': case '2': case '3':{                   /* スイッチ */
      const on=puz&&puz.sw[+ch];

      g.fillStyle='#6fbc55'; g.fillRect(px_+2,py+9,3,1); g.fillRect(px_+11,py+3,3,1);
      { const c=['#f06a8a','#f0d060','#e08ad0'][Math.floor(hsh(wx,wy,5)*3)];

let G=null;

     bag:{ball:5,potion:3},money:1500,coins:0,medal:0,dex:{},flags:{},badges:{},

const SAVEKEY='monsterquest_v1';

function hasSave(){ try{ return !!localStorage.getItem(SAVEKEY); }catch(e){ return false; } }
function seen(id){ if(!G.dex[id]) G.dex[id]=1; }
function caught(id){ G.dex[id]=2; }
const M=()=>MAPS[G.map];
const alive=()=>G.party.filter(m=>m.hp>0);

/* ============================ 移動 ============================ */
let mv=null, bob=0, cam={x:0,y:0};
/* ジムの仕掛けの状態。マップに入るたびに初期化する（部屋を出ればリセット） */
let puz=null;
function initPuz(k){ puz=(MAPS[k]&&MAPS[k].puz)?{map:k,sw:{},ov:{}}:null; }
/* ジムトレーナーを全員倒すと開く扉 */
function gateOpen(mp){
  if(!G) return false;
  const gs=(mp.npcs||[]).filter(n=>n.trainer&&n.guard);
  return gs.length>0 && gs.every(n=>G.flags['t_'+mp.key+'_'+n.x+'_'+n.y]);
}
function tileAt(mp,x,y){
  const r=mp.rows; if(y<0||y>=r.length||x<0||x>=r[0].length) return 'T';
  const c=r[y][x];
  if(c==='!') return (G&&G.flags['i_'+mp.key+'_'+x+'_'+y])?(mp.ground||'.'):'!';
  if(c==='K') return (G&&G.flags['cut_'+mp.key+'_'+x+'_'+y])?(mp.ground||'.'):'K';
  /* うずしお。でんどう入りすると しずまって わたれる みずになる */
  if(c==='V') return (G&&G.flags.ending)?'W':'V';
  if(c==='G') return gateOpen(mp)?'f':'G';
  if(puz&&puz.map===mp.key){
    const o=puz.ov[x+','+y]; if(o!==undefined) return o;
    if(c==='A'&&puz.sw[1]) return 'f';
    if(c==='B'&&puz.sw[2]) return 'f';
    if(c==='C'&&puz.sw[3]) return 'f';
  }
  return c;
}
/* 門番はバッジを見せると脇へどく。倒したトレーナーは hide フラグで消える */
const npcOpen=n=>!!(n.gate&&(n.gate.badge?hasBadge(n.gate.badge)
                            :n.gate.flag?G.flags[n.gate.flag]:false));
const npcGone=n=>!!(n.hide&&G.flags[n.hide]);
function npcXY(n){ return (npcOpen(n)&&n.open)?[n.x+n.open[0],n.y+n.open[1]]:[n.x,n.y]; }
function npcAt(mp,x,y){
  return (mp.npcs||[]).find(n=>{ if(npcGone(n)) return false;
    const q=npcXY(n); return q[0]===x&&q[1]===y; });
}
function blocked(mp,x,y){
  const t=tileAt(mp,x,y);
  if(t==='W') return !(G&&G.surf)||!!npcAt(mp,x,y);   /* なみのり中だけ みずへ */
  return SOLID.includes(t)||!!npcAt(mp,x,y);
}
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};

function tryMove(dir){
  G.dir=dir;
  const [dx,dy]=DIRV[dir], nx=G.x+dx, ny=G.y+dy;
  if(puz && tileAt(M(),nx,ny)==='O' && !npcAt(M(),nx,ny)
     && (!M().hmPush || hasHM('strength'))){
    /* 岩押し。押した先が床なら岩ごと1マス進む */
    const bx=nx+dx, by=ny+dy, t=tileAt(M(),bx,by);
    if('f.~'.includes(t)&&!npcAt(M(),bx,by)){   /* 屋内・野外・洞窟の床どれでも押せる */
      puz.ov[nx+','+ny]='f'; puz.ov[bx+','+by]='O';
      sfx('no'); ui.flashScreen=4;
      mv={dx,dy,t:0,dur:15};
    }
    return;
  }
  if(blocked(M(),nx,ny)) return;
  mv={dx,dy,t:0,dur:13};
}
function updField(){
  if(mv){
    mv.t++;
    if(mv.t>=mv.dur){
      G.x+=mv.dx; G.y+=mv.dy; mv=null; G.steps++;
      onStep();
    }
    return;
  }
  if(ui.busy||ui.menu||ui.text) return;
  const dir=dirHeld();
  if(dir){ if(repT<=0){ tryMove(dir); repT=0; } } else repT=0;
}
function onStep(){
  const mp=M();
  if(G.surf && tileAt(mp,G.x,G.y)!=='W') G.surf=0;   /* りくに あがったら おりる */
  const w=(mp.warps||[]).find(w=>w.x===G.x&&w.y===G.y);
  if(w){ doWarp(w); return; }
  const surfTbl=mp.surf||mp.fish;
  if(G.surf && surfTbl && alive().length && Math.random()<0.07){
    const t=surfTbl;
    const tot=t.list.reduce((a,b)=>a+b[1],0);
    let r=Math.random()*tot, id=t.list[0][0];
    for(const q of t.list){ r-=q[1]; if(r<=0){ id=q[0]; break; } }
    battle({wild:mk(id,ri(t.lv[0],t.lv[1]))});
    return;
  }
  const st=mp.rows[G.y][G.x];
  if(puz&&(st==='1'||st==='2'||st==='3')){
    puz.sw[+st]=!puz.sw[+st];
    sfx(puz.sw[+st]?'ok':'no'); ui.flashScreen=8;
    return;
  }
  if(tileAt(mp,G.x,G.y)===(mp.encTile||',')&&mp.enc&&alive().length){
    if(Math.random()<(mp.encRate||0.13)) startWild(mp);
  }
}
async function doWarp(w){
  ui.busy=true; sfx('warp');
  for(let i=0;i<=10;i++){ ui.fade=i/10; await sleep(20); }
  G.map=w.to; G.x=w.tx; G.y=w.ty; mv=null;
  /* 着地が みずなら なみのりを つづける（海の上で うごけなくなるのを ふせぐ）*/
  G.surf=(tileAt(MAPS[w.to],w.tx,w.ty)==='W')?1:0;
  G.visited=G.visited||{}; if(FLYPT.some(f=>f.k===w.to)) G.visited[w.to]=1;
  initPuz(w.to); bgmSync();
  ui.busy=false; ui.banner={t:MAPS[w.to].name,n:110};
  for(let i=10;i>=0;i--){ ui.fade=i/10; await sleep(20); }
  ui.fade=0;
}
function startWild(mp){
  const tot=mp.enc.list.reduce((a,b)=>a+b[1],0);
  let r=Math.random()*tot, id=mp.enc.list[0][0];
  for(const [k,wt] of mp.enc.list){ r-=wt; if(r<=0){ id=k; break; } }
  const lv=ri(mp.enc.lv[0],mp.enc.lv[1]);
  battle({wild:mk(id,lv)});
}
function facing(){ const [dx,dy]=DIRV[G.dir]; return {x:G.x+dx,y:G.y+dy}; }
function interact(){
  const mp=M(), f=facing(), n=npcAt(mp,f.x,f.y);
  if(n){ n.dir={up:'down',down:'up',left:'right',right:'left'}[G.dir]; talk(n); return; }
  const s=(mp.signs||{})[f.x+','+f.y];
  if(s){ runScript([s]); return; }
  if(tileAt(mp,f.x,f.y)==='!'){ pickItem(f.x,f.y); return; }
  if(tileAt(mp,f.x,f.y)==='M'){ slotMachine(); return; }
  const t=tileAt(mp,f.x,f.y);
  if(t==='W'){ waterAction(); return; }
  if(t==='K'){ useCut(f.x,f.y); return; }
  else if(t==='T') runScript(['おおきな きが しげっている。']);
}
async function runScript(lines){
  ui.busy=true;
  for(const l of lines) await say(l);
  ui.busy=false;
}
async function talk(n){
  ui.busy=true;
  if(n.heal){
    await say('ようこそ! モンスターを かいふく しますか?',{name:n.nm,keep:true});
    const c=await choose(['はい','いいえ'],{x:104,y:66,w:50,cancel:true,cols:1});
    ui.text=null;
    if(c===0){
      sfx('heal'); ui.flashScreen=18;
      for(const m of G.party){ m.hp=m.max; m.st=null; m.slp=0; for(const q of m.mv) q.pp=q.mp; }
      await sleep(500);
      await say('はい! げんきに なりましたよ。',{name:n.nm});
    } else await say('また いつでも どうぞ。',{name:n.nm});
    ui.busy=false; return;
  }
  if(n.shop){ await shop(n); ui.busy=false; return; }
  if(n.hm){ await giveHM(n); ui.busy=false; return; }
  if(n.coin){ await coinShop(n); ui.busy=false; return; }
  if(n.prize){ await prizeShop(n); ui.busy=false; return; }
  if(n.tower){ await towerDesk(n); ui.busy=false; return; }
  if(n.medal){ await medalShop(n); ui.busy=false; return; }
  if(n.record){ await recordDesk(n); ui.busy=false; return; }
  if(n.types){ await typeDesk(n); ui.busy=false; return; }
  if(n.legend){
    if(!alive().length){ await say('たたかえる モンスターが いない!'); ui.busy=false; return; }
    for(const l of n.legend.pre) await say(l);
    await say(SP[n.legend.id].n+'が たちふさがった!');
    ui.busy=false;
    battle({wild:mk(n.legend.id,n.legend.lv),legend:n.legend.flag});
    return;
  }
  if(n.gift&&!G.flags[n.gift.flag]){
    for(const l of (n.say||[])) await say(l,{name:n.nm});
    await say(n.gift.msg,{name:n.nm});
    G.flags[n.gift.flag]=1;
    G.bag[n.gift.item]=(G.bag[n.gift.item]||0)+1;
    sfx('catch');
    await say(ITEMS[n.gift.item].n+'を もらった!');
    ui.busy=false; return;
  }
  if(n.gate){
    for(const l of (npcOpen(n)? (n.say2||['どうぞ とおって。']) : n.say)) await say(l,{name:n.nm});
    ui.busy=false; return;
  }
  if(n.trainer){
    const done=G.flags['t_'+G.map+'_'+n.x+'_'+n.y];
    const tr=n.trainer;
    if(done){
      for(const l of tr.after) await say(l,{name:n.nm});
      /* でんどう入り後は 四天王とチャンピオンに なんども いどめる（レベルは +12） */
      if(G.flags.ending && (tr.champ||tr.bgm==='elite')){
        await say('もういちど しょうぶするか?',{name:n.nm,keep:true});
        const y=await choose(['たたかう','やめる'],{x:96,y:60,w:60,cols:1,cancel:true});
        ui.text=null;
        if(y===0){
          const spec=tr.champ?champParty():tr.party;
          ui.busy=false;
          battle({trainer:{name:n.nm,party:spec.map(([id,lv])=>mk(id,lv+12)),
                           money:Math.floor((tr.money||0)/2),bgm:tr.bgm,champ:tr.champ,
                           win:tr.win}});
          return;
        }
      }
      ui.busy=false; return;
    }
    for(const l of tr.pre) await say(l,{name:n.nm});
    ui.busy=false;
    const spec=tr.rival?rivalParty(1):tr.rival2?rivalParty(2):tr.rival3?rivalParty(3)
             :tr.champ?champParty():tr.party;
    const party=spec.map(([id,lv])=>mk(id,lv));
    battle({trainer:{name:n.nm,party,money:tr.money,win:tr.win,badge:tr.badge,
                     champ:tr.champ,key:'t_'+G.map+'_'+n.x+'_'+n.y}});
    return;
  }

}

function drawField(){
  const mp=M(), rows=mp.rows, mw=rows[0].length*16, mh=rows.length*16;
  const off=mv?mv.t/mv.dur:0;
  const px_=(G.x+(mv?mv.dx*off:0))*16, py=(G.y+(mv?mv.dy*off:0))*16;
  cam.x=clamp(Math.round(px_-72),0,Math.max(0,mw-W));
  cam.y=clamp(Math.round(py-64),0,Math.max(0,mh-H));
  p.fillStyle='#000'; p.fillRect(0,0,W,H);
  const t0=Math.floor(cam.x/16), t1=Math.ceil((cam.x+W)/16);
  const s0=Math.floor(cam.y/16), s1=Math.ceil((cam.y+H)/16);
  for(let y=s0;y<=s1;y++) for(let x=t0;x<=t1;x++)
    drawTile(tileAt(mp,x,y),x*16-cam.x,y*16-cam.y,x,y);
  const ents=[];
  for(const n of (mp.npcs||[])){
    if(npcGone(n)) continue;
    const q=npcXY(n), nx=q[0]*16, ny=q[1]*16;
    ents.push({y:ny,draw:()=>{
      if(n.mon){
        const bob=Math.sin(tick/22)*1.5;
        drawSpr(monSpr(n.mon),nx-cam.x,ny-cam.y-3+bob,1,false);
      } else drawSpr(heroSpr(n.pal,n.dir),nx-cam.x,ny-cam.y-2,1,n.dir==='left');
      if(n.trainer && !G.flags['t_'+G.map+'_'+n.x+'_'+n.y]){
        const b=Math.sin(tick/9)*1.5;
        p.fillStyle='#fff'; p.fillRect(nx-cam.x+7,ny-cam.y-12+b,2,5); p.fillRect(nx-cam.x+7,ny-cam.y-6+b,2,2);
      }
    }});
  }
  const walking=!!mv, bobo=walking?(Math.floor(mv.t/4)%2?1:0):0;
  ents.push({y:py,draw:()=>{
    const sx=Math.round(px_-cam.x), sy=Math.round(py-cam.y);
    if(G.surf){                                   /* なみのり中は いかだに のる */
      const w=Math.round(Math.sin(tick/9));
      p.fillStyle='#ffffff'; p.fillRect(sx-1,sy+12+w,18,2);   /* しぶき */
      p.fillStyle='#a5763f'; p.fillRect(sx+1,sy+7+w,14,5);    /* いかだ */
      p.fillStyle='#c99a5e'; p.fillRect(sx+2,sy+7+w,12,2);
      p.fillStyle='#6b4326'; p.fillRect(sx+1,sy+11+w,14,2);
      p.fillStyle='#e8f4ff'; p.fillRect(sx-2,sy+14+w,6,1); p.fillRect(sx+12,sy+14+w,6,1);
      drawSpr(heroSpr('hero',G.dir),sx,sy-6+w,1,G.dir==='left');
    } else drawSpr(heroSpr('hero',G.dir),sx,sy-2+bobo,1,G.dir==='left');
  }});
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents) e.draw();
  if(ui.fish){
    const bx=Math.round(px_-cam.x), by=Math.round(py-cam.y);
    p.fillStyle='#ffffff'; p.fillRect(bx+4,by-16,8,11);
    p.fillStyle='#20161f'; p.fillRect(bx+7,by-14,2,5); p.fillRect(bx+7,by-8,2,2);
  }
  if(tileAt(mp,G.x,G.y)===','){ p.fillStyle='#3f8a3a'; p.fillRect(Math.round(px_-cam.x),Math.round(py-cam.y)+9,16,5);
    p.fillStyle='#5cc255'; for(let i=0;i<4;i++) p.fillRect(Math.round(px_-cam.x)+2+i*4,Math.round(py-cam.y)+9,1,4); }
}

let bt=null;
const stg=n=>n>=0?(2+n)/2:2/(2-n);
function resetB(m){ m.bst={atk:0,def:0}; }
function calcDmg(a,b,mv){
  const stab=SP[a.id].t===mv.t?1.5:1, e=eff(mv.t,SP[b.id].t);
  if(e===0) return {v:0,e:0,crit:1};                /* こうかが ない */
  const crit=Math.random()<0.0625?2:1;
  const A=a.atk*stg(a.bst.atk), D=b.def*stg(b.bst.def);
  let v=Math.floor(((2*a.lv/5+2)*mv.pw*A/D)/50)+2;
  v=Math.floor(v*stab*e*crit*(0.85+Math.random()*0.15));
  return {v:Math.max(1,v),e,crit};
}
function catchShakes(f,mul){
  const st=f.st==='ねむり'?2:(f.st?1.5:1);
  const a=((3*f.max-2*f.hp)/(3*f.max))*SP[f.id].cr*mul*st;
  if(a>=255) return 4;
  const b=Math.floor(65536/Math.pow(255/a,0.25));
  let s=0; for(let i=0;i<4;i++){ if(Math.floor(Math.random()*65536)<b) s++; else break; }
  return s;
}
async function tweenHp(side){
  const key=side==='me'?'dm':'df';
  const tgt=(side==='me'?bt.me:bt.foe).hp;
  while(Math.abs(bt[key]-tgt)>0.4){ bt[key]+=(tgt-bt[key])*0.18; await sleep(16); }
  bt[key]=tgt;
}
async function shake(side,n){
  const k=side==='me'?'md':'fd';
  for(let i=0;i<(n||4);i++){ bt.anim[k]=(i%2?-3:3); await sleep(45); }
  bt.anim[k]=0;
}
async function blink(side,n){
  const k=side==='me'?'mh':'fh';
  for(let i=0;i<(n||3);i++){ bt.anim[k]=1; await sleep(70); bt.anim[k]=0; await sleep(70); }
}
async function lunge(side){
  const k=side==='me'?'md':'fd', s=side==='me'?1:-1;
  for(let i=0;i<5;i++){ bt.anim[k]=s*(i+1)*2; await sleep(16); }
  for(let i=4;i>=0;i--){ bt.anim[k]=s*(i+1)*2; await sleep(16); }
  bt.anim[k]=0;
}
const nm=m=>m.name;
const foeLbl=()=>bt.wild?'やせいの '+nm(bt.foe):'あいての '+nm(bt.foe);

async function useMove(atkMe,key){
  const A=atkMe?bt.me:bt.foe, B=atkMe?bt.foe:bt.me;
  const slot=A.mv.find(x=>x.k===key); if(slot) slot.pp=Math.max(0,slot.pp-1);
  const m=MV[key], who=atkMe?nm(A):foeLbl();
  if(A.st==='ねむり'){
    if(A.slp>0){ A.slp--; await say(who+'は ぐっすり ねむっている!'); return; }
    A.st=null; await say(who+'は めを さました!');
  }
  if(A.st==='まひ' && Math.random()<0.25){ await say(who+'は からだが しびれて うごけない!'); return; }
  await say(who+'の '+m.n+'!',{keep:true});
  await sleep(280);
  if(m.ac>0 && Math.random()*100>m.ac){ ui.text=null; await say('しかし はずれた!'); return; }
  if(m.hl){ ui.text=null; const h=Math.floor(A.max*m.hl); A.hp=Math.min(A.max,A.hp+h); sfx('heal');
    await tweenHp(atkMe?'me':'foe'); await say(who+'は たいりょくを かいふくした!'); return; }
  if(m.sf){ ui.text=null; const [s,v]=m.sf; A.bst[s]=clamp(A.bst[s]+v,-6,6); sfx('ok');
    await say(who+'の '+(s==='atk'?'こうげき':'ぼうぎょ')+'が あがった!'); return; }
  if(m.en){ ui.text=null; const [s,v]=m.en; B.bst[s]=clamp(B.bst[s]+v,-6,6); sfx('no');
    await blink(atkMe?'foe':'me',2);
    await say((atkMe?foeLbl():nm(B))+'の '+(s==='atk'?'こうげき':'ぼうぎょ')+'が さがった!'); return; }
  if(m.pw===0 && m.st){
    ui.text=null;
    if(B.st){ await say((atkMe?foeLbl():nm(B))+'には こうかが なかった…'); return; }
    B.st=m.st; if(m.st==='ねむり') B.slp=ri(1,3);
    sfx('no'); await blink(atkMe?'foe':'me',3);
    await say((atkMe?foeLbl():nm(B))+'は '+m.st+'に なった!'); return;
  }
  const r=calcDmg(A,B,m);
  await lunge(atkMe?'me':'foe');
  moveSE(m.t);
  await playFx(m.t,!atkMe);
  sfx(r.crit>1?'crit':'hit');
  B.hp=Math.max(0,B.hp-r.v);
  ui.flashScreen=r.crit>1?10:4;
  await Promise.all([shake(atkMe?'foe':'me',r.e>=2?6:4), tweenHp(atkMe?'foe':'me')]);
  ui.text=null;
  if(r.crit>1) await say('きゅうしょに あたった!');
  if(r.e===0) await say('こうかが ないようだ…');
  else if(r.e>1) await say('こうかは バツグンだ!');
  else if(r.e<1) await say('こうかは いまひとつの ようだ…');
  if(B.hp>0 && m.st && Math.random()*100<(m.stc||0) && !B.st){
    B.st=m.st; if(m.st==='ねむり') B.slp=ri(1,3);
    await say((atkMe?foeLbl():nm(B))+'は '+m.st+'に なった!');
  }
}
async function endTurnStatus(who){
  const A=who==='me'?bt.me:bt.foe;
  if(A.hp<=0) return;
  if(A.st==='どく'){
    A.hp=Math.max(0,A.hp-Math.max(1,Math.floor(A.max/8)));
    sfx('no'); await blink(who,2); await tweenHp(who);
    await say((who==='me'?nm(A):foeLbl())+'は どくで きずついた!');
  }
}
function aiMove(){
  const f=bt.foe, usable=f.mv.filter(x=>x.pp>0);
  if(!usable.length) return 'tackle';
  let best=usable[0], bs=-1;
  for(const s of usable){
    const m=MV[s.k];
    let sc=m.pw? m.pw*eff(m.t,SP[bt.me.id].t)*(SP[f.id].t===m.t?1.5:1) : 28;
    sc*=0.7+Math.random()*0.6;
    if(sc>bs){ bs=sc; best=s; }
  }
  return best.k;
}
async function faintCheck(){
  if(bt.foe.hp<=0){
    sfx('faint'); await blink('foe',4); bt.anim.fh=1;
    await say(foeLbl()+'は たおれた!');
    return 'foe';
  }
  if(bt.me.hp<=0){
    sfx('faint'); await blink('me',4); bt.anim.mh=1;
    await say(nm(bt.me)+'は たおれてしまった!');
    return 'me';
  }
  return null;
}
async function gainExp(){
  const base=SP[bt.foe.id].x, g=Math.max(1,Math.floor(base*bt.foe.lv/7));
  const parts=G.party.filter(m=>m.hp>0);
  for(const m of parts){
    m.exp+=g;
    await say(nm(m)+'は '+g+' けいけんちを もらった!');
    while(m.lv<60 && m.exp>=expFor(m.lv+1)){
      grow(m,()=>{ m.lv++; });
      sfx('lvl'); ui.flashScreen=14;
      await say(nm(m)+'は レベル '+m.lv+'に あがった!');
      for(const [ml,mk_] of SP[m.id].lv){
        if(ml===m.lv && !m.mv.find(x=>x.k===mk_)) await learn(m,mk_);
      }
      const ev=SP[m.id].ev;
      if(ev && m.lv>=ev[1]) await evolve(m,ev[0]);
    }
  }
}
async function learn(m,key){
  if(m.mv.length<4){ m.mv.push({k:key,pp:MV[key].pp,mp:MV[key].pp});
    await say(nm(m)+'は '+MV[key].n+'を おぼえた!'); return; }
  await say(nm(m)+'は '+MV[key].n+'を おぼえたい! でも わざは 4つまで…',{keep:true});
  const items=m.mv.map(s=>({t:MV[s.k].n,r:MV[s.k].t})).concat([{t:'おぼえない',r:''}]);
  const c=await choose(items,{x:8,y:44,w:144,cols:1,title:'わすれる わざを えらぶ'});
  ui.text=null;
  if(c<0||c===4){ await say(nm(m)+'は '+MV[key].n+'を おぼえなかった。'); return; }
  const old=MV[m.mv[c].k].n;
  m.mv[c]={k:key,pp:MV[key].pp,mp:MV[key].pp};
  await say(nm(m)+'は '+old+'を わすれて '+MV[key].n+'を おぼえた!');
}
async function evolve(m,to){

async function throwBall(key){
  const mul=ITEMS[key].ball;

  await say(ITEMS[key].n+'を なげた!',{keep:true});

  bt.anim.fh=1; bt.ball.hold=1; ui.text=null;
  const s=catchShakes(bt.foe,mul);
  for(let i=0;i<Math.min(s,3);i++){ sfx('tick'); bt.ball.shake=1; await sleep(160); bt.ball.shake=0; await sleep(320); }
  if(s>=4){
    sfx('catch'); await say('やった! '+nm(bt.foe)+'を つかまえた!');
    caught(bt.foe.id);
    const c=bt.foe; resetB(c);
    if(G.party.length<6){ G.party.push(c); await say(c.name+'は なかまに くわわった!'); }
    else { G.box.push(c);
      await say('てもちが いっぱい! '+c.name+'は ボックスへ おくられた。');
      await say('メニューの「ボックス」から つれてこられる。'); }
    bt.ball=null; return true;
  }
  bt.ball=null; bt.anim.fh=0; sfx('no');
  await say(['もうすこし だったのに!','おしい! あと ひといき!','ざんねん! ボールから でてしまった!','ダメだ! ぜんぜん つかまらない!'][Math.min(s,3)]);
  return false;
}
async function battle(o){
  const prev=scene; scene='battle'; ui.busy=true;
  const isTr=!!o.trainer;
  const friendly=isTr&&o.trainer.friendly;
  const tower=isTr&&!!o.trainer.tower;    /* バトルタワーの れんせん */
  /* 戦闘の種類ごとに曲を変える。トレーナー側で bgm を指定もできる */
  const kind=o.legend?'legend'
    :isTr?(o.trainer.bgm||(o.trainer.champ?'champion':o.trainer.badge?'gym':'boss'))
    :'battle';
  /* 友達戦は本編に一切影響させない。開始前の状態を控えて終了時に戻す */
  const snap=friendly?G.party.map(m=>({hp:m.hp,st:m.st,slp:m.slp,pp:m.mv.map(s=>s.pp)})):null;
  bgmPlay(kind);
  bt={tr:o.trainer||null, leg:!!o.legend, kind, ei:0, wild:!isTr,
      foe:isTr?o.trainer.party[0]:o.wild, me:alive()[0],
      anim:{md:0,fd:0,mh:0,fh:0}, ball:null, intro:0};
  resetB(bt.me); resetB(bt.foe);
  bt.dm=bt.me.hp; bt.df=bt.foe.hp;
  seen(bt.foe.id);
  sfx('warp');
  for(let i=0;i<14;i++){ bt.intro=i/14; await sleep(28); }
  bt.intro=1;
  if(isTr){ await say(o.trainer.name+'が しょうぶを しかけてきた!');
    await say(o.trainer.name+'は '+nm(bt.foe)+'を くりだした!'); }
  else await say('あっ! やせいの '+nm(bt.foe)+'が とびだしてきた!');
  await say('ゆけっ! '+nm(bt.me)+'!');

  let running=true, result='';
  while(running){
    const act=await battleMenu();
    if(act.t==='run'){
      if(isTr){ await say('トレーナーせんから にげられない!'); }
      else{
        const odds=bt.me.spd*128/Math.max(1,bt.foe.spd)+30;
        if(Math.random()*256<odds){ await say('うまく にげきれた!'); result='run'; break; }
        await say('にげられない!');
      }
    } else if(act.t==='ball'){
      const ok=await throwBall(act.k);
      if(ok){ result='caught'; break; }
    } else if(act.t==='item'){
      // 使用済み。ターン消費
    } else if(act.t==='switch'){
      await say(nm(bt.me)+' もどれ!');
      bt.me=G.party[act.i]; resetB(bt.me); bt.dm=bt.me.hp;
      await say('ゆけっ! '+nm(bt.me)+'!');
    }
    // 相手のターン
    if(bt.foe.hp>0 && bt.me.hp>0){
      const fk=aiMove();
      if(act.t==='move'){
        const pm=MV[act.k], fm=MV[fk];
        const ps=bt.me.spd*(bt.me.st==='まひ'?0.5:1), fs=bt.foe.spd*(bt.foe.st==='まひ'?0.5:1);
        const meFirst=(pm.pr||0)!==(fm.pr||0)? (pm.pr||0)>(fm.pr||0) : (ps===fs?Math.random()<0.5:ps>fs);
        if(meFirst){ await useMove(true,act.k); if(bt.foe.hp>0) await useMove(false,fk); }
        else { await useMove(false,fk); if(bt.me.hp>0) await useMove(true,act.k); }
      } else await useMove(false,fk);
    }
    await endTurnStatus('me'); await endTurnStatus('foe');
    const f=await faintCheck();
    if(f==='foe'){
      if(!friendly&&!tower) await gainExp();
      if(isTr && bt.ei<o.trainer.party.length-1){
        bt.ei++; bt.foe=o.trainer.party[bt.ei]; resetB(bt.foe); bt.df=bt.foe.hp;
        bt.anim.fh=0; seen(bt.foe.id);
        await say(o.trainer.name+'は '+nm(bt.foe)+'を くりだした!');
      } else {
        if(friendly){
          await say(o.trainer.name+'に かった!');
          for(const l of o.trainer.win) await say(l,{name:o.trainer.name});
        } else if(isTr){
          const mn=o.trainer.money||0;
          await say(o.trainer.name+'に かった!');
          if(mn>0){ G.money=Math.min(999999,G.money+mn);
            await say('しょうきんとして '+mn+'えんを てにいれた!'); }
          for(const l of o.trainer.win) await say(l,{name:o.trainer.name});
          if(o.trainer.key) G.flags[o.trainer.key]=1;
          if(o.trainer.champ) G.flags.champion=1;
          if(o.trainer.badge && !hasBadge(o.trainer.badge.id)){
            const bd=BADGES.find(b=>b.id===o.trainer.badge.id);
            G.badges[bd.id]=1; sfx('catch'); ui.flashScreen=20;
            await say(bd.n+'を てにいれた!');
            await say('バッジは メニューの「バッジ」で かくにんできる。');
          }
        } else {
          const mn=bt.foe.lv*9+ri(5,30); G.money+=mn;
          await say('おかね '+mn+'えんを ひろった!');
        }
        result='win';
      }
      if(result) break;
    } else if(f==='me'){
      const rest=alive();
      if(!rest.length){ result='lose'; break; }
      await say('つぎの モンスターを えらんで ください。');
      const i=await pickParty({force:true});
      bt.me=G.party[i]; resetB(bt.me); bt.dm=bt.me.hp; bt.anim.mh=0;
      await say('ゆけっ! '+nm(bt.me)+'!');
    }
  }
  for(let i=14;i>=0;i--){ bt.intro=i/14; await sleep(24); }
  bt=null; scene='field'; ui.busy=false; ui.text=null; bgmSync();
  if(o.legend&&(result==='win'||result==='caught')){
    G.flags[o.legend]=1;
    ui.busy=true;
    if(result==='win') await say('…その すがたは きえて しまった。');
    else await say('でんせつの モンスターを てに いれた!');
    save(); ui.busy=false;
  }
  if(friendly){
    ui.busy=true;
    G.party.forEach((m,i)=>{ const q=snap[i]; if(!q) return;
      m.hp=q.hp; m.st=q.st; m.slp=q.slp; m.mv.forEach((s,j)=>{ s.pp=q.pp[j]; }); });
    if(result==='lose') await say('ともだちに まけてしまった…');
    await say('※ つうしんたいせんは ぼうけんの きろくに えいきょう しません。');
    ui.busy=false;
  } else if(result==='lose'&&!tower){
    ui.busy=true;

/* ============================ つうしん対戦 ============================ */
/* サーバーを持てないので方式は2つ。
   1) チームコード: 手持ちを文字列にして渡し、相手のチームとAI戦
   2) ちょくせつ対戦: WebRTC で端末同士を直結し、同時進行のターン制 */
const MOVEKEYS=Object.keys(MV);
const B32='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   /* 紛らわしい 0O1I を除く */

function bytesToCode(b){
  let bits=0,val=0,out='';
  for(const x of b){ val=(val<<8)|x; bits+=8;
    while(bits>=5){ out+=B32[(val>>>(bits-5))&31]; bits-=5; } }
  if(bits>0) out+=B32[(val<<(5-bits))&31];
  return out.replace(/(.{5})(?=.)/g,'$1-');
}
function codeToBytes(s){
  s=(s||'').toUpperCase().replace(/O/g,'0').replace(/I/g,'1').replace(/[^0-9A-Z]/g,'');
  let bits=0,val=0; const out=[];
  for(const ch of s){ const i=B32.indexOf(ch); if(i<0) return null;
    val=(val<<5)|i; bits+=5;
    if(bits>=8){ out.push((val>>>(bits-8))&255); bits-=8; } }
  return out;
}
function encTeam(party){
  const live=party.slice(0,6);
  if(!live.length) return null;
  const b=[1,live.length];
  for(const m of live){
    b.push(Math.max(0,DEXORDER.indexOf(m.id)), clamp(m.lv,1,100));
    for(let i=0;i<4;i++){ const s=m.mv[i]; b.push(s?MOVEKEYS.indexOf(s.k)+1:0); }
  }
  let c=0; for(const x of b) c=(c+x)&255; b.push(c);
  return bytesToCode(b);
}
function decTeam(code){
  const b=codeToBytes(code);
  if(!b||b.length<9) return null;
  let c=0; for(let i=0;i<b.length-1;i++) c=(c+b[i])&255;
  if(c!==b[b.length-1]||b[0]!==1) return null;
  const n=b[1];
  if(n<1||n>6||b.length<2+n*6+1) return null;
  const out=[];
  for(let i=0;i<n;i++){
    const o=2+i*6, id=DEXORDER[b[o]];
    if(!id) return null;
    const m=mk(id,clamp(b[o+1],1,100));
    const mvs=[];
    for(let j=0;j<4;j++){ const k=b[o+2+j], key=k?MOVEKEYS[k-1]:null;
      if(key) mvs.push({k:key,pp:MV[key].pp,mp:MV[key].pp}); }
    if(mvs.length) m.mv=mvs;
    m.name=SP[id].n; m.hp=m.max; m.st=null; m.slp=0;
    resetB(m);
    out.push(m);
  }
  return out;
}

/* ---------------- 2) ちょくせつ対戦 (WebRTC P2P) ---------------- */
let net=null, netQ=[], netWait=null, nb=null;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},
                       {urls:'stun:stun1.l.google.com:19302'}]};
function b64enc(u8){ let s=''; for(const x of u8) s+=String.fromCharCode(x); return btoa(s); }
function b64dec(s){ const t=atob(s), u=new Uint8Array(t.length);
  for(let i=0;i<t.length;i++) u[i]=t.charCodeAt(i); return u; }
async function packSig(o){
  const s=JSON.stringify({sdp:o.sdp,type:o.type});
  if(window.CompressionStream){
    try{
      const cs=new CompressionStream('deflate-raw');
      const buf=await new Response(new Blob([s]).stream().pipeThrough(cs)).arrayBuffer();
      return 'Z'+b64enc(new Uint8Array(buf));
    }catch(e){}
  }
  return 'R'+btoa(unescape(encodeURIComponent(s)));
}
async function unpackSig(str){
  try{
    str=(str||'').replace(/\s/g,'');
    const tag=str[0], body=str.slice(1);
    if(tag==='Z'&&window.DecompressionStream){
      const ds=new DecompressionStream('deflate-raw');
      const buf=await new Response(new Blob([b64dec(body)]).stream().pipeThrough(ds)).arrayBuffer();
      return JSON.parse(new TextDecoder().decode(buf));
    }
    if(tag==='R') return JSON.parse(decodeURIComponent(escape(atob(body))));
  }catch(e){}
  return null;
}
function netClose(){
  if(net){ try{ net.dc&&net.dc.close(); }catch(e){} try{ net.pc&&net.pc.close(); }catch(e){} }
  net=null; netQ=[]; if(netWait){ const r=netWait; netWait=null; r(); }
}
function netSend(o){ try{ if(net&&net.dc&&net.dc.readyState==='open') net.dc.send(JSON.stringify(o)); }catch(e){} }
function netHook(dc){
  dc.onmessage=ev=>{ try{ netQ.push(JSON.parse(ev.data)); }catch(e){}
    if(netWait){ const r=netWait; netWait=null; r(); } };
  dc.onclose=dc.onerror=()=>{ if(net) net.dead=1;
    if(netWait){ const r=netWait; netWait=null; r(); } };
}
async function netRecv(type,ms){
  const t0=Date.now();
  while(true){
    const i=netQ.findIndex(m=>m.t===type);
    if(i>=0) return netQ.splice(i,1)[0];
    if(!net||net.dead) return null;
    if(ms&&Date.now()-t0>ms) return null;
    await new Promise(r=>{ netWait=r; setTimeout(()=>{ if(netWait===r){netWait=null;r();} },150); });
  }
}
async function waitIce(pc){
  if(pc.iceGatheringState==='complete') return;
  await new Promise(r=>{
    let done=false;
    const fin=()=>{ if(done) return; done=true; clearTimeout(t);
      pc.removeEventListener('icegatheringstatechange',h); r(); };
    const h=()=>{ if(pc.iceGatheringState==='complete') fin(); };
    const t=setTimeout(fin,4000);
    pc.addEventListener('icegatheringstatechange',h);
  });
}
async function netConnect(asHost){
  let pc;
  try{ pc=new RTCPeerConnection(ICE); }
  catch(e){ await say('この ブラウザでは ちょくせつたいせんが つかえない…'); return false; }
  net={pc,dc:null,host:asHost,dead:0};
  let openRes; const opened=new Promise(r=>{ openRes=r; });
  try{
    if(asHost){
      const dc=pc.createDataChannel('mq',{ordered:true});
      net.dc=dc; netHook(dc); dc.onopen=()=>openRes(true);
      await pc.setLocalDescription(await pc.createOffer());
      await waitIce(pc);
      await showCode('しょうたいコードを つくった!',await packSig(pc.localDescription));
      const ans=askCode('ともだちから とどいた へんじの コードを はりつけて ください');
      const d=await unpackSig(ans);
      if(!d){ sfx('no'); await say('コードが ただしくない みたいだ…'); netClose(); return false; }
      await pc.setRemoteDescription(d);
    } else {
      pc.ondatachannel=ev=>{ net.dc=ev.channel; netHook(net.dc);
        net.dc.onopen=()=>openRes(true);
        if(net.dc.readyState==='open') openRes(true); };
      const off=askCode('しょうたいコードを はりつけて ください');
      const d=await unpackSig(off);
      if(!d){ sfx('no'); await say('コードが ただしくない みたいだ…'); netClose(); return false; }
      await pc.setRemoteDescription(d);
      await pc.setLocalDescription(await pc.createAnswer());
      await waitIce(pc);
      await showCode('へんじの コードが できた!',await packSig(pc.localDescription));
      await say('これを ともだちに おくりかえしてね。');
    }
  }catch(e){ sfx('no'); await say('つなぐ じゅんびに しっぱいした…'); netClose(); return false; }
  ui.text={full:'つないでいる…',n:8,done:true,name:null};
  const ok=await Promise.race([opened,new Promise(r=>setTimeout(()=>r(false),30000))]);
  ui.text=null;
  if(!ok){
    sfx('no'); await say('つながらなかった…');
    await say('かいせんに よっては つながらないことが ある。');
    await say('そのときは チームコードたいせんを つかってね!');
    netClose(); return false;
  }
  sfx('catch'); await say('つながった!');
  return true;
}

/* --- 対戦の進行。ホストが判定し、結果を出来事の列にして両者で再生する --- */
const nbSide=s=>(s===nb.side?'me':'foe');
function nbSync(){
  bt.me=nb.team[nb.side][nb.act[nb.side]];
  bt.foe=nb.team[1-nb.side][nb.act[1-nb.side]];
  bt.dm=bt.me.hp; bt.df=bt.foe.hp;
}
function nbLabel(s){ return s===nb.side?nb.team[s][nb.act[s]].name:'あいての '+nb.team[s][nb.act[s]].name; }
/* ホスト側: 両者の行動から出来事の列をつくる */
function nbResolve(acts){
  const ev=[];
  const order=[0,1].filter(s=>acts[s]&&acts[s].k==='mv');
  order.sort((a,b)=>{
    const ma=MV[acts[a].mv], mb=MV[acts[b].mv];
    const pa=ma.pr||0, pb=mb.pr||0;
    if(pa!==pb) return pb-pa;
    const A=nb.team[a][nb.act[a]], B=nb.team[b][nb.act[b]];
    const sa=A.spd*(A.st==='まひ'?0.5:1), sb=B.spd*(B.st==='まひ'?0.5:1);
    if(sa!==sb) return sb-sa;
    return Math.random()<0.5?-1:1;
  });
  for(const s of [0,1]) if(acts[s]&&acts[s].k==='sw'){
    ev.push({e:'sw',s,i:acts[s].i}); nb.act[s]=acts[s].i;
    resetB(nb.team[s][acts[s].i]);
  }
  for(const s of order){
    const A=nb.team[s][nb.act[s]], D=nb.team[1-s][nb.act[1-s]];
    if(A.hp<=0||D.hp<=0) continue;
    const key=acts[s].mv, m=MV[key];
    const slot=A.mv.find(x=>x.k===key); if(slot) slot.pp=Math.max(0,slot.pp-1);
    if(A.st==='ねむり'){
      if(A.slp>0){ A.slp--; ev.push({e:'msg',m:'#'+s+'は ぐっすり ねむっている!'}); continue; }
      A.st=null; ev.push({e:'msg',m:'#'+s+'は めを さました!'});
    }
    if(A.st==='まひ'&&Math.random()<0.25){ ev.push({e:'msg',m:'#'+s+'は からだが しびれて うごけない!'}); continue; }
    ev.push({e:'use',s,mv:key});
    if(m.ac>0&&Math.random()*100>m.ac){ ev.push({e:'msg',m:'しかし はずれた!'}); continue; }
    if(m.hl){ const h=Math.min(A.max-A.hp,Math.floor(A.max*m.hl)); A.hp+=h;
      ev.push({e:'hp',s,hp:A.hp},{e:'msg',m:'#'+s+'は たいりょくを かいふくした!'}); continue; }
    if(m.sf){ A.bst[m.sf[0]]=clamp(A.bst[m.sf[0]]+m.sf[1],-6,6);
      ev.push({e:'msg',m:'#'+s+'の '+(m.sf[0]==='atk'?'こうげき':'ぼうぎょ')+'が あがった!'}); continue; }
    if(m.en){ D.bst[m.en[0]]=clamp(D.bst[m.en[0]]+m.en[1],-6,6);
      ev.push({e:'msg',m:'#'+(1-s)+'の '+(m.en[0]==='atk'?'こうげき':'ぼうぎょ')+'が さがった!'}); continue; }
    if(m.pw===0&&m.st){
      if(D.st){ ev.push({e:'msg',m:'#'+(1-s)+'には こうかが なかった…'}); continue; }
      D.st=m.st; if(m.st==='ねむり') D.slp=ri(1,3);
      ev.push({e:'st',s:1-s,st:m.st}); continue;
    }
    const r=calcDmg(A,D,m);
    D.hp=Math.max(0,D.hp-r.v);
    ev.push({e:'dmg',s:1-s,ty:m.t,v:r.v,hp:D.hp,eff:r.e,crit:r.crit>1?1:0});
    if(D.hp>0&&m.st&&!D.st&&Math.random()*100<(m.stc||0)){
      D.st=m.st; if(m.st==='ねむり') D.slp=ri(1,3);
      ev.push({e:'st',s:1-s,st:m.st});
    }
    if(D.hp<=0) ev.push({e:'faint',s:1-s});
    if(A.hp<=0) ev.push({e:'faint',s});
  }
  for(const s of [0,1]){
    const A=nb.team[s][nb.act[s]];
    if(A.hp>0&&A.st==='どく'){
      A.hp=Math.max(0,A.hp-Math.max(1,Math.floor(A.max/8)));
      ev.push({e:'psn',s,hp:A.hp});
      if(A.hp<=0) ev.push({e:'faint',s});
    }
  }
  return ev;
}
/* 両者共通: 出来事の列を演出つきで再生する */
async function nbPlay(ev){
  for(const q of ev){
    if(!nb) return;
    const M2=m=>m.replace(/#0/g,nbLabel(0)).replace(/#1/g,nbLabel(1));
    if(q.e==='sw'){
      nb.act[q.s]=q.i; resetB(nb.team[q.s][q.i]); nbSync();
      await say((q.s===nb.side?'ゆけっ! ':'あいては ')+nb.team[q.s][q.i].name+(q.s===nb.side?'!':'を くりだした!'));
    } else if(q.e==='use'){
      await say(nbLabel(q.s)+'の '+MV[q.mv].n+'!',{keep:true});
      await sleep(260); moveSE(MV[q.mv].t);
      await lunge(nbSide(q.s));
      await playFx(MV[q.mv].t,nbSide(1-q.s)===  'me');
      ui.text=null;
    } else if(q.e==='dmg'){
      sfx(q.crit?'crit':'hit');
      const who=nbSide(q.s);
      nb.team[q.s][nb.act[q.s]].hp=q.hp;
      ui.flashScreen=q.crit?10:4;
      await Promise.all([shake(who,q.eff>=2?6:4),tweenHp(who)]);
      if(q.crit) await say('きゅうしょに あたった!');
      if(q.eff===0) await say('こうかが ないようだ…');
      else if(q.eff>1) await say('こうかは バツグンだ!');
      else if(q.eff<1) await say('こうかは いまひとつの ようだ…');
    } else if(q.e==='hp'){
      nb.team[q.s][nb.act[q.s]].hp=q.hp; sfx('heal'); await tweenHp(nbSide(q.s));
    } else if(q.e==='psn'){
      nb.team[q.s][nb.act[q.s]].hp=q.hp; sfx('no');
      await blink(nbSide(q.s),2); await tweenHp(nbSide(q.s));
      await say(nbLabel(q.s)+'は どくで きずついた!');
    } else if(q.e==='st'){
      nb.team[q.s][nb.act[q.s]].st=q.st; sfx('no');
      await blink(nbSide(q.s),3);
      await say(nbLabel(q.s)+'は '+q.st+'に なった!');
    } else if(q.e==='faint'){
      nb.team[q.s][nb.act[q.s]].hp=0; sfx('faint');
      await blink(nbSide(q.s),4);
      bt.anim[nbSide(q.s)==='me'?'mh':'fh']=1;
      await say(nbLabel(q.s)+'は たおれた!');
    } else if(q.e==='msg'){
      await say(M2(q.m));
    }
  }
}

async function netBattle(asHost){
  ui.busy=true; scene='battle';
  const myTeam=battleClone(alive().length?G.party:G.party);
  ui.text={full:'あいての チームを まっている…',n:20,done:true,name:null};
  let rt=null;
  for(let i=0;i<90&&!rt;i++){
    netSend({t:'team',d:encTeam(G.party)});
    rt=await netRecv('team',2000);
    if(!net||net.dead) break;
  }
  ui.text=null;
  const theirs=rt&&decTeam(rt.d);
  if(!theirs){ await say('あいての チームを うけとれなかった…'); netClose(); scene='field'; ui.busy=false; return; }
  const side=asHost?0:1;
  nb={side,team:asHost?[myTeam,theirs]:[theirs,myTeam],act:[0,0]};
  nb.team[0].concat(nb.team[1]).forEach(m=>{ if(!m.bst) resetB(m); });
  bt={tr:{},ei:0,wild:false,anim:{md:0,fd:0,mh:0,fh:0},ball:null,intro:0,fx:null};
  nbSync(); bgmPlay('boss');
  for(let i=0;i<14;i++){ bt.intro=i/14; await sleep(28); }
  bt.intro=1;
  await say('ともだちとの しょうぶだ!');
  await say('ゆけっ! '+bt.me.name+'!');
  let result='';
  while(true){
    const act=await nbMenu();
    if(act.k==='gv'){ netSend({t:'act',a:{k:'gv'}}); result='lose'; break; }
    netSend({t:'act',a:act});
    ui.text={full:'あいての こうどうを まっている…',n:20,done:true,name:null};
    const rm=await netRecv('act',300000);
    ui.text=null;
    if(!rm){ result='dc'; break; }
    if(rm.a.k==='gv'){ result='win'; break; }
    const acts=[]; acts[side]=act; acts[1-side]=rm.a;
    let ev;
    if(asHost){ ev=nbResolve(acts); netSend({t:'ev',ev}); }
    else { const em=await netRecv('ev',300000); if(!em){ result='dc'; break; } ev=em.ev; }
    await nbPlay(ev);
    nbSync();
    /* 倒れたら次を出す。両者が選び終わるまで待ち合わせる */
    const myDown=nb.team[side][nb.act[side]].hp<=0;
    const myLeft=nb.team[side].some(m=>m.hp>0);
    const foeLeft=nb.team[1-side].some(m=>m.hp>0);
    if(!myLeft||!foeLeft){ result=!myLeft?(foeLeft?'lose':'draw'):'win'; break; }
    if(myDown){
      await say('つぎの モンスターを えらんで ください。');
      let i=-1;
      while(i<0){
        const items=nb.team[side].map(m=>({t:m.name,r:'Lv'+m.lv+' '+m.hp+'/'+m.max,
          col:m.hp<=0?'#8a8296':'#fff',mon:m.id}));
        const p=await choose(items,{x:6,y:16,w:148,cols:1,title:'つぎの モンスター',max:6});
        if(p>=0&&nb.team[side][p].hp>0) i=p; else sfx('no');
      }
      nb.act[side]=i; resetB(nb.team[side][i]); netSend({t:'next',i});
      bt.anim.mh=0; nbSync();
      await say('ゆけっ! '+bt.me.name+'!');
    }
    if(nb.team[1-side][nb.act[1-side]].hp<=0){
      ui.text={full:'あいてが えらんでいる…',n:16,done:true,name:null};
      const nx=await netRecv('next',300000);
      ui.text=null;
      if(!nx){ result='dc'; break; }
      nb.act[1-side]=nx.i; resetB(nb.team[1-side][nx.i]); bt.anim.fh=0; nbSync();
      await say('あいては '+bt.foe.name+'を くりだした!');
    }
  }
  for(let i=14;i>=0;i--){ bt.intro=i/14; await sleep(24); }
  bt=null; nb=null; scene='field'; ui.text=null;
  bgmSync();
  if(result==='win'){ sfx('lvl'); await say('ともだちに かった!'); }
  else if(result==='lose') await say('ともだちに まけてしまった…');
  else if(result==='draw') await say('ひきわけだ!');
  else await say('つうしんが とぎれてしまった…');
  await say('※ つうしんたいせんは ぼうけんの きろくに えいきょう しません。');
  netClose(); ui.busy=false;
}

];
const SYMART=[
["...c...","..c.c..",".c...c.","aa...aa","baa.aab",".ba.ab.","......."],
[".......",".aaaaa.","abbbbba","abbbbba",".abbba.","..aaa..","......."],
["...a...","..bbb..",".bbbbb.",".aaaaa.","aaaaaaa","...c...","......."],
["..ccc..",".abbba.","caaaaac","ccccccc","cbbbbbc",".bbbbb.","..ccc.."],
["...a...","...b...","aabbbaa",".abbba.","..aaa..",".aa.aa.","a.....a"],

];
const SYMPAY=[15,30,50,100,400,600];
const SYMNAME=['さくらんぼ','すいか','ベル','ボール','スター','セブン'];
/* リール帯。セブンは各リールに1つだけ */
const REEL=[
 [0,1,2,0,3,1,4,0,2,1,5,3],
 [1,0,3,2,0,4,1,0,2,3,5,1],
 [2,0,1,3,0,2,4,1,0,3,5,2]];
const SLOTBET=3;

function drawSym(i,x,y){
  const art=SYMART[i], pal=SYMPAL[i];
  for(let r=0;r<7;r++) for(let c=0;c<7;c++){
    const ch=art[r][c]; if(ch==='.') continue;
    fill(x+c*2,y+r*2,2,2,pal[ch]);
  }
}

async function spinOnce(){
  G.coins-=SLOTBET;
  ui.slot={pos:[ri(0,11),ri(0,11),ri(0,11)],stop:[0,0,0],msg:'Aで リールを とめよう!',win:0};
  const t=setInterval(()=>{ const s=ui.slot; if(!s) return;
    for(let i=0;i<3;i++) if(!s.stop[i]) s.pos[i]=(s.pos[i]+1)%REEL[i].length; },85);
  for(let i=0;i<3;i++){
    await waitPress();
    if(!ui.slot){ clearInterval(t); return; }
    ui.slot.stop[i]=1; sfx('tick');
    ui.slot.msg=(i<2)?'あと '+(2-i)+'つ!':'…';
    await sleep(180);
  }
  clearInterval(t);
  const r=[0,1,2].map(i=>REEL[i][ui.slot.pos[i]]);
  let pay=0, label='';
  if(r[0]===r[1]&&r[1]===r[2]){ pay=SYMPAY[r[0]]; label=SYMNAME[r[0]]+' そろい!'; }
  else if(r[0]===0&&r[1]===0){ pay=8; label='さくらんぼ 2つ!'; }
  else if(r[0]===0){ pay=2; label='さくらんぼ 1つ'; }
  if(pay){
    G.coins+=pay; ui.slot.win=pay;
    ui.slot.msg=label+'  '+pay+'コイン!';
    sfx(pay>=100?'catch':'lvl'); ui.flashScreen=pay>=100?20:8;
  } else { ui.slot.msg='…はずれ'; sfx('no'); }
  await sleep(900);
}

  ui.busy=true;

/* 殿堂入り後の やりこみ。れんせんを かちぬくと メダルが もらえる。
   とちゅうで かいふくは できない（どうぐは つかえる）。
   てもちの HP と PP は ちょうせんの まえに ひかえて、おわったら もどす。 */
const TCOURSE=[
  {id:'b',n:'ビギナー',  lv:52,win:3,med:3,  ds:'Lv52 3れんせん'},
  {id:'e',n:'エキスパート',lv:62,win:5,med:8,  ds:'Lv62 5れんせん'},

];
/* タワーに でてくる モンスター。でんせつは のぞく */
const TPOOL=['jukario','burnix','aquare','oononezu','tenkuga','gigakuwaga','gansekio',
  'enblaze','elekyu','uzushio','sorahane','kabutoga','shinkaio','ryuguji','sameja',
  'shinjuhime','genbu','kagero','enguma','rasetsu','jukaio',
  'hyogard','souryuga','mayoigami','yamirouga','tetsuyoroi','goukenou','sainenou'];
const TNAME=['ふなのり','やまおとこ','エリートトレーナー','ちょうせんしゃ','たびのしょうじょ',
  'かくとうか','しおかぜの おとこ','そらの たびびと','いわくだき','タワーの ぬし'];
const TSAY=[
 ['ここまで きたか。','だが わたしは とおさない!'],
 ['つぎは わたしの ばんだ。','いくぞ!'],
 ['まだ てもちは もつか?','ここで おわりだ!'],
 ['タワーの かべは たかいぞ。','こえられるか!'],
 ['いい かおを している。','だからこそ たおしがいが ある!']
];
function towerFoe(course,streak){
  const lv=course.lv+Math.min(4,streak);
  const party=[];
  const used={};
  for(let i=0;i<3;i++){
    let id;
    do{ id=TPOOL[Math.floor(Math.random()*TPOOL.length)]; }while(used[id]&&Object.keys(used).length<TPOOL.length);
    used[id]=1;
    party.push(mk(id,lv+ri(-1,1)));
  }
  return {name:TNAME[Math.floor(Math.random()*TNAME.length)],
          party,say:TSAY[Math.floor(Math.random()*TSAY.length)]};
}
async function towerRun(n,course){
  /* ちょうせんの まえの じょうたいを ひかえる */
  const snap=G.party.map(m=>({hp:m.hp,st:m.st,slp:m.slp,pp:m.mv.map(s=>s.pp)}));
  const back={map:G.map,x:G.x,y:G.y,dir:G.dir};
  let streak=0;
  for(let i=0;i<course.win;i++){
    const foe=towerFoe(course,i);
    await say((i+1)+'かいせん! あいては '+foe.name+'!');
    for(const l of foe.say) await say(l,{name:foe.name});
    ui.busy=false;
    const r=await battle({trainer:{name:foe.name,party:foe.party,money:0,tower:1,
      bgm:i===course.win-1?'boss':'battle',
      win:['…つよいな。つぎへ すすめ。']}});
    ui.busy=true;
    /* たたかいの あと 位置が うごいていたら もどす */
    G.map=back.map; G.x=back.x; G.y=back.y; G.dir=back.dir;
    if(r!=='win'){
      await say('ざんねん! '+streak+'れんしょうで おわった。',{name:n.nm});
      break;
    }
    streak++;
    if(i<course.win-1) await say('かちぬいた! つづけて '+(i+2)+'かいせんだ!',{name:n.nm});
  }
  /* HP と PP を もとに もどす */
  G.party.forEach((m,i)=>{ const q=snap[i]; if(!q) return;
    m.hp=q.hp; m.st=q.st; m.slp=q.slp; m.mv.forEach((s,j)=>{ s.pp=q.pp[j]; }); });
  if(streak>=course.win){
    sfx('catch'); ui.flashScreen=20;
    await say('—— ぜんしょう! みごとです!',{name:n.nm});
    G.medal=(G.medal||0)+course.med;
    await say('タワーメダルを '+course.med+'まい てにいれた!');
    G.tbest=G.tbest||{};
    if(!G.tbest[course.id]){ G.tbest[course.id]=1;
      await say(course.n+'コースを はじめて せいはしました!',{name:n.nm}); }
  }
  G.twin=G.twin||{};
  if((G.twin[course.id]||0)<streak) G.twin[course.id]=streak;
  await say('てもちの じょうたいを もとに もどしました。',{name:n.nm});
  save();
}

/* 対象スプライトは 48x48。エフェクトもその大きさに合わせる */
function drawFx(fx){
  const g=p, t=fx.t;

  d.drawImage(pix,0,0,disp.width,disp.height);
  if(ui.flashScreen>0){ ui.flashScreen--; d.fillStyle='rgba(255,255,255,'+(ui.flashScreen/26)+')'; d.fillRect(0,0,disp.width,disp.height); }
  if(scene==='title') drawTitleUI();
  if(scene==='battle'&&bt&&!ui.evo) drawBattleUI();
  if(ui.banner&&ui.banner.n>0){ ui.banner.n--;
    box(4,4,Math.max(50,tw(ui.banner.t,9)+16),18);
    T(ui.banner.t,12,9,{size:9,color:'#f4b942'}); }
  if(ui.prompt&&ui.menu){
    box(3,99,93,42);
    const ls=wrap(ui.prompt,84,8.5), y0=ls.length>1?107:114;
    for(let i=0;i<Math.min(ls.length,3);i++) T(ls[i],8,y0+i*11,{size:8.5});
  }
  drawTextBox();
  drawSlot();
  drawMenu();
  drawQty();
  drawDetail();
  if(ui.fade>0){ d.fillStyle='rgba(0,0,0,'+ui.fade+')'; d.fillRect(0,0,disp.width,disp.height); }
}
/* ============================ 起動 ============================ */
async function opening(){
  ui.busy=true;
  await say('ようこそ! モンスターの せかいへ!',{name:'ハカセ'});
  await say('この せかいには ふしぎな いきものが たくさん くらしている。',{name:'ハカセ'});
  await say('きみも きょうから モンスタートレーナーだ!',{name:'ハカセ'});
  await say('さあ 1ぴき えらびなさい。',{name:'ハカセ',keep:true});
  ui.text=null;
  const ids=['mokuri','pochika','shizuku'];
  let c;
  while(true){
    c=await choose(ids.map(id=>({t:SP[id].n,r:SP[id].t})),{x:20,y:68,w:120,cols:1,pick3:1});
    await say(SP[ids[c]].n+'に きめますか?',{keep:true});
    const y=await choose(['はい','いいえ'],{x:104,y:36,w:48,cols:1,cancel:true});
    ui.text=null;
    if(y===0) break;
  }
  const id=ids[c];
  G.flags.starter=id;
  const s=mk(id,5); G.party.push(s); caught(id);
  sfx('catch');
  await say(SP[id].n+'を うけとった!');
  await say('その モンスターを たいせつに するんだよ。',{name:'ハカセ'});
  await say('きたの ルート1で しゅぎょうを つむと いい!',{name:'ハカセ'});
  ui.busy=false;
}
async function titleGo(){
  if(ui.menu||ui.busy) return;
  ui.busy=true;
  const opts=hasSave()?['つづきから','はじめから']:['はじめから'];
  const c=await choose(opts,{x:44,y:82,w:72,cols:1});
  if(hasSave()&&c===0){
    if(load()){ scene='field'; ui.busy=false; ui.banner={t:M().name,n:110}; return; }
  }
  if(hasSave()&&c===1){
    await say('いまの きろくは きえてしまいます。よろしいですか?',{keep:true});
    const y=await choose(['はい','いいえ'],{x:104,y:36,w:48,cols:1,cancel:true});
    ui.text=null;
    if(y!==0){ ui.busy=false; return; }
  }
  newGame(); scene='field'; ui.busy=false;
  await opening();
}
function loop(){
  tick++;
  /* 端末やブラウザによってレイアウト確定が遅れるので定期的に採寸し直す */
  if((tick&31)===0) fit();
  if((tick&15)===0) bgmSync();
  try{
    if(scene==='field') updField();
    draw();
  }catch(e){ if(!loop.warned){ loop.warned=1; console.error(e); } }
  requestAnimationFrame(loop);
}
fit(); scene='title'; loop();
setInterval(()=>{ if(G&&scene==='field'&&!ui.busy) G.play++; },1000);
